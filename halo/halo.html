<title>Halo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Halo: lecteur de musique. Noir profond + argent chromé, look iOS. */
:root{
 --bg:#000;--bg2:#0D0D0F;--card:#1A1A1D;--card2:#232327;--line:rgba(255,255,255,.09);
 --fg:#F5F5F7;--mute:#8E8E93;--dim:#5A5A60;--silver:#D9DCE1;
 --chrome:linear-gradient(135deg,#FFFFFF 0%,#C9CCD2 28%,#868B94 50%,#EEF0F2 70%,#9A9FA8 100%);
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;
 --ease:cubic-bezier(.32,.72,0,1);
 --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
 color-scheme:dark;
}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--silver);outline-offset:2px;border-radius:8px}
svg{display:block}
.chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease,transform .7s var(--ease)}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .bgglow{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:radial-gradient(circle,rgba(220,225,235,.16) 0%,rgba(120,125,135,.06) 22%,transparent 45%);opacity:0;animation:bgg 1.6s 1.15s ease forwards}
@keyframes bgg{to{opacity:1}}
#intro .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-40px}
#intro .logo{width:190px;height:190px;position:relative}
#intro svg{width:100%;height:100%;overflow:visible}
#intro .spin{transform-origin:100px 100px;animation:spin 3s .2s var(--ease) forwards}
@keyframes spin{from{transform:rotate(-90deg)}to{transform:rotate(330deg)}}
#intro .ring{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s .25s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#intro .head{opacity:0;animation:head 1.25s .2s linear forwards}
@keyframes head{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
#intro .headg{transform-origin:100px 100px;animation:headrot 1s .25s cubic-bezier(.65,0,.35,1) forwards}
@keyframes headrot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#intro .rglow{opacity:0;animation:flash 1.4s 1.2s ease forwards}
@keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:.35}}
#intro .pulse{transform-origin:100px 100px;animation:bump .7s 1.2s var(--ease)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.09)}100%{transform:scale(1)}}
#intro .rip{position:absolute;left:50%;top:95px;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:1.5px solid rgba(235,238,242,.7);opacity:0;animation:rip 1.5s cubic-bezier(.2,.6,.3,1) forwards}
#intro .rip:nth-child(2){animation-delay:1.22s}#intro .rip:nth-child(3){animation-delay:1.4s}#intro .rip:nth-child(4){animation-delay:1.58s}
@keyframes rip{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
#intro .word{display:flex;font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:10px}
#intro .word span{display:inline-block;opacity:0;transform:translateY(22px) scale(.9);filter:blur(10px);animation:let .8s var(--ease) forwards;background:linear-gradient(100deg,#8D929B 0%,#F7F8FA 40%,#FFFFFF 50%,#A3A8B0 62%,#E4E6EA 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
#intro .word span:nth-child(1){animation-delay:1.45s}#intro .word span:nth-child(2){animation-delay:1.52s}#intro .word span:nth-child(3){animation-delay:1.59s}#intro .word span:nth-child(4){animation-delay:1.66s}
@keyframes let{to{opacity:1;transform:none;filter:blur(0)}}
#intro .word.shine span{animation:let .8s var(--ease) forwards,shine 1.3s ease forwards;animation-delay:inherit}
#intro .tag{font-size:15px;color:var(--mute);letter-spacing:.01em;opacity:0;transform:translateY(6px);animation:let .7s 2s var(--ease) forwards}
#intro .skip{position:absolute;bottom:calc(var(--bot) + 26px);font-size:13px;color:var(--dim);opacity:0;animation:let .5s 1.2s forwards}
#app{transition:transform .8s var(--ease),opacity .6s ease}
body.intro #app{transform:scale(.94);opacity:0}

/* ---------- layout ---------- */
#app{position:fixed;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 8px) 0 calc(var(--bot) + 170px);background:var(--bg)}
.view[hidden]{display:none}
.page{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--bot) + 170px);animation:pin .45s var(--ease)}
.page.leave{animation:pout .35s var(--ease) forwards}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pout{to{transform:translateX(100%)}}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 20px 6px;max-width:720px;margin:0 auto}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.1}
.lt .hello{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.roundbtn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;color:var(--silver)}
.roundbtn svg{width:18px;height:18px}
h2.sec{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:28px 20px 12px;max-width:680px;display:flex;align-items:center;justify-content:space-between}
@media(min-width:760px){h2.sec{margin-left:auto;margin-right:auto;padding:0 20px;max-width:720px}}
h2.sec small{font-size:15px;font-weight:500;color:var(--mute)}

/* hero */
.hero{position:relative;margin:14px 20px 0;border-radius:22px;overflow:hidden;aspect-ratio:1.25;max-height:420px;display:block;width:calc(100% - 40px);text-align:left;isolation:isolate}
@media(min-width:760px){.hero{max-width:680px;margin:14px auto 0;width:auto;display:block}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
.hero .in{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:12px}
.hero .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.7);text-transform:uppercase}
.hero .t{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.05}
.hero .a{font-size:15px;color:rgba(255,255,255,.75);margin-top:3px}
.hero .grow{flex:1;min-width:0}
.playfab{width:52px;height:52px;border-radius:50%;background:var(--chrome);display:grid;place-items:center;color:#000;flex:none;box-shadow:0 6px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.playfab svg{width:22px;height:22px;margin-left:2px}

/* quick grid */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px;margin-top:18px;max-width:720px;margin-left:auto;margin-right:auto}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;overflow:hidden;height:56px;text-align:left;font-size:13px;font-weight:600;padding-right:8px;transition:transform .15s,background .2s}
.qt:active{transform:scale(.97);background:var(--card2)}
.qt img{width:56px;height:56px;flex:none;object-fit:cover}
.qt span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}

/* carousels */
.row{display:flex;gap:14px;overflow-x:auto;padding:0 20px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:20px}
.row::-webkit-scrollbar{display:none}
@media(min-width:760px){.row{padding-left:max(20px,calc(50% - 340px));scroll-padding-left:max(20px,calc(50% - 340px))}}
.tile{flex:none;width:150px;text-align:left;scroll-snap-align:start}
.tile img{width:150px;height:150px;border-radius:12px;object-fit:cover;background:var(--card);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.tile.big{width:200px}.tile.big img{width:200px;height:200px}
.tile .t{font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:active img{transform:scale(.97)}
.tile img{transition:transform .15s}

/* import card */
.imp{margin:0 20px;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1C1C20,#121214);border:1px solid var(--line);display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 40px)}
@media(min-width:760px){.imp{max-width:680px;margin:0 auto;display:flex}}
.imp .ic{width:52px;height:52px;border-radius:14px;background:var(--chrome);display:grid;place-items:center;color:#111;flex:none}
.imp .ic svg{width:26px;height:26px}
.imp b{font-size:16px;display:block}
.imp span{font-size:13px;color:var(--mute);display:block;margin-top:3px;line-height:1.35}

/* track list */
.list{padding:0 20px;max-width:720px;margin:0 auto}
.tr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 0;position:relative}
.tr img{width:48px;height:48px;border-radius:7px;object-fit:cover;flex:none;background:var(--card)}
.tr .num{width:22px;text-align:center;color:var(--mute);font-size:15px;flex:none;font-variant-numeric:tabular-nums}
.tr .mid{flex:1;min-width:0;border-bottom:.5px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-bottom:1px}
.tr:last-child .mid{border-bottom:0}
.tr .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .s{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.on .t{color:#fff;font-weight:600}
.tr .more{width:34px;height:34px;display:grid;place-items:center;color:var(--mute);flex:none;margin-right:-6px}
.tr .more svg{width:20px;height:20px}
.tr:active{background:rgba(255,255,255,.04)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--silver);border-radius:1px;height:4px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.liked{color:var(--silver);margin-left:4px;font-size:11px}

/* collection page */
.navbar{position:sticky;top:0;z-index:3;padding:calc(var(--top) + 6px) 12px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#000 40%,rgba(0,0,0,0))}
.back{display:flex;align-items:center;gap:2px;font-size:17px;color:var(--silver);height:36px;padding-right:8px}
.back svg{width:24px;height:24px}
.chead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 8px;max-width:720px;margin:0 auto}
.chead img{width:min(64vw,260px);height:min(64vw,260px);border-radius:14px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12)}
.chead h3{font-size:22px;font-weight:700;margin:18px 0 2px;letter-spacing:-.02em}
.chead .by{font-size:20px;font-weight:500}
.chead .meta{font-size:13px;color:var(--mute);margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 12px;max-width:720px;margin:0 auto}
.bigbtn{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600}
.bigbtn svg{width:18px;height:18px}
.bigbtn.pri{background:var(--chrome);color:#0A0A0B;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 18px rgba(200,205,215,.12)}
.bigbtn.sec{background:var(--card);color:var(--silver)}
.bigbtn:active{transform:scale(.97)}
.foot{font-size:13px;color:var(--mute);padding:18px 20px;max-width:720px;margin:0 auto}

/* search */
.sbox{margin:8px 20px 4px;display:flex;align-items:center;gap:8px;height:40px;border-radius:11px;background:var(--card);padding:0 12px;color:var(--mute);max-width:680px}
@media(min-width:760px){.sbox{margin:8px auto 4px}}
.sbox svg{width:17px;height:17px;flex:none}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:17px;-webkit-user-select:text;user-select:text}
.sbox input::placeholder{color:var(--mute)}
.genres{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;max-width:720px;margin:0 auto}
.genre{position:relative;height:104px;border-radius:14px;overflow:hidden;text-align:left;padding:12px 14px;font-size:17px;font-weight:700;isolation:isolate}
.genre img{position:absolute;right:-14px;bottom:-14px;width:84px;height:84px;border-radius:8px;transform:rotate(22deg);z-index:-1;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.genre:active{transform:scale(.97)}

/* library */
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:8px 0;text-align:left}
.lrow img,.lrow .ph{width:60px;height:60px;border-radius:8px;object-fit:cover;flex:none}
.lrow .ph{display:grid;place-items:center;background:var(--card);color:var(--silver)}
.lrow .ph svg{width:26px;height:26px}
.lrow .mid{flex:1;min-width:0}
.lrow .t{font-size:17px}
.lrow .s{font-size:13px;color:var(--mute);margin-top:2px}
.lrow .chev{color:var(--dim);width:16px;height:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:0 20px;max-width:720px;margin:0 auto}
@media(min-width:600px){.grid2{grid-template-columns:repeat(3,1fr)}}
.grid2 .tile,.grid2 .tile img{width:100%;height:auto}
.grid2 .tile img{aspect-ratio:1}
.empty{color:var(--mute);font-size:15px;text-align:center;padding:30px 30px;line-height:1.45}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 10px calc(var(--bot) + 4px);background:rgba(18,18,20,.78);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid rgba(255,255,255,.1)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#6B6B70;padding:4px 0 6px}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--fg)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(230,232,236,.35))}

/* mini player */
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--bot) + 62px);z-index:19;height:60px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 6px 0 7px;background:rgba(40,40,44,.8);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.12);transform:translateY(calc(100% + 140px));transition:transform .5s var(--ease);max-width:700px;margin:0 auto;overflow:hidden}
#mini.show{transform:none}
#mini img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#mini .mid{flex:1;min-width:0;text-align:left}
#mini .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .b{width:42px;height:42px;display:grid;place-items:center;flex:none}
#mini .b svg{width:24px;height:24px}
#mini .prog{position:absolute;left:14px;right:14px;bottom:0;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#mini .prog i{display:block;height:100%;width:0;background:var(--silver)}
.spin-s{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--silver);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* now playing */
#np{position:fixed;inset:0;z-index:40;background:#050506;transform:translateY(100%);transition:transform .5s var(--ease);overflow:hidden;display:flex;flex-direction:column;touch-action:none}
#np.open{transform:none}
#np.drag{transition:none}
#np .bgimg{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(60px) saturate(.6) brightness(.55);opacity:.85;z-index:0}
#np::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.75));z-index:0}
#np .in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:460px;margin:0 auto;padding:calc(var(--top) + 8px) 26px calc(var(--bot) + 14px)}
#np .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:4px auto 10px}
#np .topl{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#np .topl button{width:34px;height:34px;display:grid;place-items:center;color:rgba(255,255,255,.85)}
#np .topl svg{width:22px;height:22px}
#np .art{flex:1;display:grid;place-items:center;min-height:0;padding:14px 0}
#np .cv{position:relative;width:min(100%,46vh,400px);aspect-ratio:1}
#np .cv img{position:relative;width:100%;height:100%;border-radius:14px;object-fit:cover;box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);transition:transform .6s var(--ease)}
#np.paused .cv img{transform:scale(.84)}
#np .halo{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(235,238,244,.42) 0%,rgba(200,205,215,.16) 38%,rgba(0,0,0,0) 68%);opacity:.6;will-change:transform,opacity}
#np .meta{display:flex;align-items:center;gap:12px;margin-top:4px}
#np .meta .mid{flex:1;min-width:0}
#np .meta .t{font-size:22px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .meta .s{font-size:19px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#np .heart{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
#np .heart svg{width:20px;height:20px}
#np .heart.on{background:var(--chrome);color:#111}
#np .wave{position:relative;height:44px;margin-top:18px;cursor:pointer;touch-action:none}
#np .wave canvas{width:100%;height:100%;display:block}
#np .times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;margin-top:4px;font-weight:500}
#np .ctr{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;padding:0 6px}
#np .ctr .sm{width:40px;height:40px;display:grid;place-items:center;color:rgba(255,255,255,.55)}
#np .ctr .sm.on{color:#fff}
#np .ctr .sm svg{width:22px;height:22px}
#np .ctr .sm .one{position:absolute;font-size:9px;font-weight:800;margin:9px 0 0 9px}
#np .ctr .sk{width:58px;height:58px;display:grid;place-items:center}
#np .ctr .sk svg{width:38px;height:38px}
#np .ctr .pp{width:78px;height:78px;border-radius:50%;background:var(--chrome);color:#0A0A0B;display:grid;place-items:center;box-shadow:0 10px 36px rgba(220,224,232,.18),inset 0 1px 0 #fff}
#np .ctr .pp svg{width:34px;height:34px}
#np .ctr button:active{transform:scale(.9)}
#np .ctr button{transition:transform .15s}
#np .bot{display:flex;justify-content:space-around;margin-top:14px;color:rgba(255,255,255,.65)}
#np .bot button{width:44px;height:36px;display:grid;place-items:center}
#np .bot svg{width:22px;height:22px}
#np .bot .on{color:#fff}

/* queue panel */

#scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}

#sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 8px);z-index:61;max-width:460px;margin:0 auto;transform:translateY(120%);transition:transform .42s var(--ease)}

 return h||'<div class="empty">Aucun résultat pour « '+esc(QUERY)+' »</div>'}
function libHTML(){
 var h='<header class="lt"><h1>Bibliothèque</h1><button class="roundbtn" data-act="new-pl" aria-label="Nouvelle playlist">'+I.plus+'</button></header><div class="list">';
 h+='<button class="lrow" data-act="open" data-id="likes:"><img alt="" src="'+cov("liked")+'"><div class="mid"><div class="t">Titres likés</div><div class="s">Playlist · '+S.likes.length+' titre'+(S.likes.length>1?"s":"")+'</div></div>'+I.chev.replace("<svg",'<svg class="chev"')+'</button>';
 h+='<button class="lrow" data-act="open" data-id="mine:"><img alt="" src="'+cov("mine")+'"><div class="mid"><div class="t">Tes sons</div><div class="s">Importés · '+FILES.length+'</div></div>'+I.chev.replace("<svg",'<svg class="chev"')+'</button>';
 S.pls.forEach(function(p){h+='<button class="lrow" data-act="open" data-id="pl:'+p.id+'"><img alt="" src="'+plCover(p)+'"><div class="mid"><div class="t">'+esc(p.name)+'</div><div class="s">Playlist · '+p.ids.length+' titre'+(p.ids.length>1?"s":"")+'</div></div>'+I.chev.replace("<svg",'<svg class="chev"')+'</button>'});
 h+='<button class="lrow" data-act="new-pl"><span class="ph">'+I.plus+'</span><div class="mid"><div class="t">Nouvelle playlist</div></div></button>';
 h+='</div><h2 class="sec">Albums</h2><div class="grid2">'+ALBUMS.map(function(a){return tile(cov("a:"+a.id),a.title,a.artist,"open","album:"+a.id)}).join("")+'</div>';
 h+='<h2 class="sec">Importer</h2>'+impCard();
 return h}
function plCover(p){var k="p:"+p.id+":"+(p.ids[0]||"");if(!COVER[k]){var first=p.ids[0];COVER[k]=first?trCover(first):drawCover("pl",hash(p.id),[190,195,210])}return COVER[k]}
function coll(key){
 var i=key.indexOf(":"),type=key.slice(0,i),id=key.slice(i+1);
 if(type==="album"){var a=ALB[id];return {title:a.title,by:a.artist,meta:STYLE_NAME[a.style]+" · "+a.year,cover:cov("a:"+id),ids:a.ids,num:1}}
 if(type==="mix"){var m=MIXES.filter(function(x){return x.id===id})[0];return {title:m.title,by:"Halo",meta:m.sub+" · change chaque jour",cover:cov("m:"+id),ids:mixIds(m)}}
 if(type==="genre"){var ids=[];ALBUMS.forEach(function(a){if(a.style===id)ids=ids.concat(a.ids)});return {title:STYLE_NAME[id],by:"Halo",meta:ids.length+" titres",cover:cov("a:"+ALBUMS.filter(function(a){return a.style===id})[0].id),ids:ids}}
 if(type==="likes")return {title:"Titres likés",by:"Toi",meta:S.likes.length+" titres",cover:cov("liked"),ids:S.likes.filter(function(x){return TR[x]}),empty:"Touche le cœur pendant l'écoute pour garder un titre ici."};
 if(type==="mine")return {title:"Tes sons",by:"Depuis ton iPhone",meta:FILES.length+" fichiers",cover:cov("mine"),ids:mineIds(),empty:"Pas encore de sons. Importe tes fichiers audio depuis l'app Fichiers.",imp:1};
 if(type==="pl"){var p=S.pls.filter(function(x){return x.id===id})[0];if(!p)return null;return {title:p.name,by:"Ta playlist",meta:p.ids.length+" titres",cover:plCover(p),ids:p.ids.filter(function(x){return TR[x]}),empty:"Ajoute des titres avec le bouton ··· à côté d'une chanson.",pl:p.id}}
 return null}
function collHTML(key){
 var c=coll(key);if(!c)return '<div class="empty">Introuvable</div>';var tot=c.ids.reduce(function(s,id){return s+(TR[id].dur||0)},0);
 var h='<div class="navbar"><button class="back" data-act="back">'+I.back+'Retour</button>'+(c.pl?'<button class="roundbtn" data-act="pl-menu" data-id="'+c.pl+'" aria-label="Options">'+I.more+'</button>':c.imp?'<button class="roundbtn" data-act="import" aria-label="Importer">'+I.plus+'</button>':"")+'</div>';
 h+='<div class="chead"><img alt="" src="'+c.cover+'"><h3>'+esc(c.title)+'</h3><div class="by chrome">'+esc(c.by)+'</div><div class="meta">'+esc(c.meta)+(tot?" · "+Math.max(1,Math.round(tot/60))+" min":"")+'</div></div>';
 if(c.ids.length){h+='<div class="actions"><button class="bigbtn pri" data-act="play-coll" data-id="'+esc(key)+'">'+I.play+'Lecture</button><button class="bigbtn sec" data-act="shuffle-coll" data-id="'+esc(key)+'">'+I.shuffle+'Aléatoire</button></div>';
  h+='<div class="list" data-list="'+esc(c.ids.join(","))+'" data-from="'+esc(c.title)+'">'+trackRows(c.ids,{num:c.num})+'</div>'}
 else h+='<div class="empty">'+esc(c.empty||"Vide")+'</div>'+(c.imp?impCard():"");
 return h}
function renderTab(){
 ["home","search","lib"].forEach(function(k){$("#v-"+k).hidden=k!==TAB});
 document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===TAB)});
 if(TAB==="home")$("#v-home").innerHTML=homeHTML();
 else if(TAB==="search"){if(!$("#q"))$("#v-search").innerHTML=searchHTML();else $("#sres").innerHTML=searchRes()}
 else $("#v-lib").innerHTML=libHTML();
 renderPages()}
function renderPages(anim){var st=STACK[TAB],box=$("#pages");var ex=box.querySelectorAll(".page");
 if(!st.length){box.innerHTML="";return}
 var key=st[st.length-1],sc=ex.length?ex[ex.length-1].scrollTop:0;box.innerHTML='<div class="page" style="'+(anim?"":"animation:none")+'">'+collHTML(key)+'</div>';if(!anim)box.firstChild.scrollTop=sc}
function push(key){STACK[TAB].push(key);renderPages(true)}
function pop(){var pg=$("#pages .page");if(!pg)return;pg.classList.add("leave");setTimeout(function(){STACK[TAB].pop();renderPages(false);if(STACK[TAB].length){var p=$("#pages .page");if(p)p.scrollTop=0}},300)}
function refresh(){var keepS=$(".view:not([hidden])"),sc=keepS?keepS.scrollTop:0;renderTab();if(keepS)keepS.scrollTop=sc;updatePlayer()}
function refreshLists(){document.querySelectorAll("[data-list]").forEach(function(l){var ids=l.dataset.list.split(",");var num=!!l.querySelector(".num");l.innerHTML=trackRows(ids,{num:num})});if($("#queue").classList.contains("open"))renderQueue()}

/* ---------------- sheets & toast ---------------- */
var tTimer;function toast(ic,txt){var t=$("#toast");t.innerHTML=ic+esc(txt);t.classList.add("on");clearTimeout(tTimer);tTimer=setTimeout(function(){t.classList.remove("on")},1900)}
function sheet(html){$("#sheet").innerHTML=html+'<button class="scancel" data-act="close-sheet">Annuler</button>';$("#scrim").classList.add("on");$("#sheet").classList.add("on")}
function closeSheet(){$("#scrim").classList.remove("on");$("#sheet").classList.remove("on")}
$("#scrim").addEventListener("click",closeSheet);
function trackMenu(id){var t=TR[id];var lk=liked(id),h='<div class="sgroup"><div class="shead"><img alt="" src="'+trCover(id)+'"><div><b>'+esc(t.title)+'</b><span>'+esc(t.artist)+'</span></div></div>';
 h+='<button class="sopt" data-act="m-next" data-id="'+id+'">Lire ensuite'+I.upnext+'</button>';
 h+='<button class="sopt" data-act="m-add" data-id="'+id+'">Ajouter à une playlist'+I.addlist+'</button>';
 h+='<button class="sopt" data-act="m-like" data-id="'+id+'">'+(lk?"Retirer des titres likés":"J'aime")+(lk?I.heartf:I.heart)+'</button>';
 if(t.kind==="gen")h+='<button class="sopt" data-act="m-album" data-id="'+t.album+'">Voir l\'album'+I.album+'</button>';
 var top=STACK[TAB][STACK[TAB].length-1];if(top&&top.indexOf("pl:")===0)h+='<button class="sopt red" data-act="m-unpl" data-id="'+id+'" data-pl="'+top.slice(3)+'">Retirer de la playlist'+I.trash+'</button>';
 if(t.kind==="file")h+='<button class="sopt red" data-act="m-del" data-id="'+id+'">Supprimer de Halo'+I.trash+'</button>';
 sheet(h+'</div>')}
function addMenu(id){var h='<div class="sgroup"><div class="shead"><div><b>Ajouter à une playlist</b><span>'+esc(TR[id].title)+'</span></div></div>';
 S.pls.forEach(function(p){h+='<button class="sopt" data-act="m-addto" data-id="'+id+'" data-pl="'+p.id+'">'+esc(p.name)+(p.ids.indexOf(id)>=0?I.check:I.plus)+'</button>'});
 h+='<button class="sopt" data-act="new-pl" data-id="'+id+'">Nouvelle playlist…'+I.plus+'</button></div>';sheet(h)}
function newPl(withId,rename){var cur=rename?S.pls.filter(function(p){return p.id===rename})[0]:null;
 sheet('<div class="sgroup sform"><b>'+(cur?"Renommer":"Nouvelle playlist")+'</b><input id="plname" maxlength="40" placeholder="Nom de la playlist" value="'+esc(cur?cur.name:"")+'"><button class="bigbtn pri" data-act="pl-save" data-id="'+(withId||"")+'" data-pl="'+(rename||"")+'">'+(cur?"Enregistrer":"Créer")+'</button></div>');
 setTimeout(function(){var i=$("#plname");if(i)i.focus()},380)}
function plMenu(id){sheet('<div class="sgroup"><button class="sopt" data-act="pl-rename" data-id="'+id+'">Renommer'+I.addlist+'</button><button class="sopt red" data-act="pl-del" data-id="'+id+'">Supprimer la playlist'+I.trash+'</button></div>')}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-act]");
 if(!el){if(e.target.closest("#mini"))openNP();return}
 var a=el.dataset.act,id=el.dataset.id;e.stopPropagation();
 if(a==="toggle"){toggle();return}
 if(a==="next"){next(false);return}
 if(a==="prev"){prev();return}
 if(a==="close-np"){closeNP();return}
 if(a==="shuffle"){S.shuffle=!S.shuffle;save();if(P.cur){if(S.shuffle){P.queue=shuffled(P.base,P.cur);P.idx=0}else{P.queue=P.base.slice();P.idx=Math.max(0,P.queue.indexOf(P.cur))}}updatePlayer();toast(I.shuffle,S.shuffle?"Aléatoire activé":"Aléatoire désactivé");return}
 if(a==="repeat"){S.repeat=(S.repeat+1)%3;save();updatePlayer();toast(I.repeat,["Répétition désactivée","Répéter la liste","Répéter ce titre"][S.repeat]);return}
 if(a==="like-cur"){if(P.cur)toggleLike(P.cur);return}
 if(a==="add-cur"){if(P.cur)addMenu(P.cur);return}
 if(a==="more-cur"){if(P.cur)trackMenu(P.cur);return}
 if(a==="queue"){var q=$("#queue");if(!q.classList.contains("open"))renderQueue();q.classList.toggle("open");return}
 if(a==="close-queue"){$("#queue").classList.remove("open");return}
 if(a==="close-sheet"){closeSheet();return}
 if(a==="import"){unlock();$("#file").click();return}
 if(a==="open"){push(id);return}
 if(a==="back"){pop();return}
 if(a==="play-coll"||a==="shuffle-coll"){var c=coll(id);if(c&&c.ids.length){playList(c.ids,a==="shuffle-coll"?Math.floor(Math.random()*c.ids.length):0,c.title,a==="shuffle-coll"?true:false)}return}
 if(a==="play-one"){playList([id].concat(S.recent.filter(function(x){return x!==id&&TR[x]})),0,"Écoutés récemment");return}
 if(a==="play-mine"){var ids=mineIds();playList(ids,ids.indexOf(id),"Tes sons");return}
 if(a==="play-in"){var l=el.closest("[data-list]");if(el.closest("#queue")){var qi=P.queue.indexOf(id,P.idx);if(qi>=0){P.idx=qi;load(id,true)}return}
  if(l){var li=l.dataset.list.split(",");if(id===P.cur){openNP();return}playList(li,li.indexOf(id),l.dataset.from)}return}
 if(a==="track-menu"){trackMenu(id);return}
 if(a==="m-next"){closeSheet();if(!P.cur){playList([id],0,"");return}P.queue.splice(P.idx+1,0,id);toast(I.upnext,"Lu ensuite");return}
 if(a==="m-add"){addMenu(id);return}
 if(a==="m-like"){closeSheet();toggleLike(id);return}
 if(a==="m-album"){closeSheet();closeNP();push("album:"+id);return}
 if(a==="m-del"){closeSheet();if(P.cur===id){audio.pause();P.cur=null;P.queue=[];updatePlayer()}delFile(id);return}
 if(a==="m-unpl"){var p=S.pls.filter(function(x){return x.id===el.dataset.pl})[0];if(p){p.ids=p.ids.filter(function(x){return x!==id});save()}closeSheet();refresh();return}
 if(a==="m-addto"){var p2=S.pls.filter(function(x){return x.id===el.dataset.pl})[0];if(p2&&p2.ids.indexOf(id)<0){p2.ids.push(id);save()}closeSheet();toast(I.check,"Ajouté à "+(p2?p2.name:""));refresh();return}
 if(a==="new-pl"){newPl(id||"");return}
 if(a==="pl-save"){var nm=($("#plname").value||"").trim()||"Ma playlist";if(el.dataset.pl){var p3=S.pls.filter(function(x){return x.id===el.dataset.pl})[0];if(p3)p3.name=nm}else{var np2={id:Date.now().toString(36),name:nm,ids:id?[id]:[]};S.pls.push(np2);toast(I.check,"Playlist créée")}save();closeSheet();refresh();return}
 if(a==="pl-menu"){plMenu(id);return}
 if(a==="pl-rename"){newPl("",id);return}
 if(a==="pl-del"){S.pls=S.pls.filter(function(x){return x.id!==id});save();closeSheet();pop();setTimeout(refresh,320);return}
},false);
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="plname"){var b=$('[data-act="pl-save"]');if(b)b.click()}if(e.key==="Enter"&&e.target.closest&&e.target.closest(".tr")){e.target.click()}});
$("#tabbar").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;var k=b.dataset.tab;if(k===TAB&&STACK[k].length){STACK[k]=[];}TAB=k;renderTab();var v=$("#v-"+k);if(k===TAB&&!STACK[k].length)v.scrollTop=v.scrollTop});
document.addEventListener("input",function(e){if(e.target.id==="q"){QUERY=e.target.value;$("#sres").innerHTML=searchRes()}});
$("#file").addEventListener("change",function(e){var f=Array.prototype.slice.call(e.target.files||[]);e.target.value="";importFiles(f)});
window.addEventListener("resize",function(){drawWave()});

/* ---------------- boot ---------------- */
function initChrome(){
 document.querySelectorAll(".tab").forEach(function(b){var k=b.dataset.tab;b.innerHTML=I[k==="home"?"home":k==="search"?"search":"lib"]+(k==="home"?"Écouter":k==="search"?"Rechercher":"Bibliothèque")});
 $("#np-down").innerHTML=I.down;$("#np-more").innerHTML=I.more;$("#np-prev").innerHTML=I.prev;$("#np-next").innerHTML=I.next;$("#np-sh").innerHTML=I.shuffle;$("#np-add").innerHTML=I.addlist;$("#np-q").innerHTML=I.queue;
 $('#mini [data-act="next"]').innerHTML=I.next;
}
function intro(){var el=$("#intro");document.body.classList.add("intro");var done=false;
 function end(){if(done)return;done=true;el.classList.add("out");document.body.classList.remove("intro");setTimeout(function(){el.remove()},800)}
 el.addEventListener("pointerdown",function(){unlock();end()});setTimeout(end,3100)}
initChrome();intro();buildCovers();renderTab();updatePlayer();requestAnimationFrame(loop);
idb().then(idbAll).then(function(rows){FILES=rows.sort(function(a,b){return b.added-a.added});FILES.forEach(regFile);S.likes=S.likes.filter(function(x){return TR[x]});S.recent=S.recent.filter(function(x){return TR[x]});refresh()}).catch(function(){});
window.__halo={engine:engine,genWav:genWav,STY:STY,TR:TR,P:P,audio:audio,getSrc:getSrc};
})();
