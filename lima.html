<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Familjen+Grotesk:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Limelight&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: iOS-native store. Large-title pages, grouped backgrounds, Today cards, carousels, translucent nav + tab bar. Games keep their own dark worlds. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(118,118,128,.12); --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.17); --blue:#007AFF; --bar:rgba(249,249,249,.8); --shadow:0 10px 30px -12px rgba(0,0,0,.28);
  --f-sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-sysd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-disp:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* aliases used by older parts */
  --paper:var(--bg); --ink:var(--label); --mute:var(--label2); --line:var(--sep); --accent:var(--blue);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--blue:#0A84FF;--bar:rgba(22,22,24,.8);--shadow:0 10px 30px -12px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--blue:#0A84FF;--bar:rgba(22,22,24,.8);--shadow:0 10px 30px -12px rgba(0,0,0,.8);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--f-sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;letter-spacing:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.press:active{transform:scale(.97);transition-duration:.12s}

/* ---------- NAV + TAB BAR ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.nav{position:fixed;left:0;right:0;top:0;z-index:19;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));text-align:center;font-family:var(--f-sysd);font-weight:600;font-size:17px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s}
.nav.show{opacity:1;transform:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;justify-content:space-around;padding:7px max(10px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--label3);padding-bottom:4px;letter-spacing:0}
.tabbar svg{width:27px;height:27px}
.tabbar button.on{color:var(--blue)}

/* ---------- PAGES ---------- */
#store{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 4px}
.lt .date{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--label2);letter-spacing:.01em}
.lt h1{font-family:var(--f-sysd);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;margin-bottom:3px;box-shadow:0 0 0 .5px var(--sep)}
.avatar svg{width:100%;height:100%;display:block}
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 10px;padding-top:14px;border-top:.5px solid var(--sep)}
.hdr h2{font-family:var(--f-sysd);font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0}
.hdr small{display:block;font-size:13px;color:var(--label2);font-weight:400;margin-top:1px;letter-spacing:0}
.hdr .link{font-size:17px;color:var(--blue);font-weight:400}

/* Today cards */
.today{display:flex;flex-direction:column;gap:28px;margin-top:14px}
.tcard{position:relative;display:block;width:100%;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-align:left;color:#fff;isolation:isolate}
.tcard.tall{height:min(118vw,470px)}
.tcard canvas,.tcard .art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.tcard .cap{padding:20px 20px 0}
.tcard .k{font-size:13px;font-weight:600;text-transform:uppercase;opacity:.75;letter-spacing:.01em}
.tcard h3{font-family:var(--f-sysd);font-size:28px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance;max-width:14ch}
.tcard .foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.tcard .foot .ic{width:44px;flex:none}
.tcard .foot div{flex:1;min-width:0}
.tcard .foot b{display:block;font-size:15px;font-weight:600}
.tcard .foot small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .foot .pill{background:rgba(255,255,255,.25);color:#fff}
.tcard.list{color:var(--label);padding:20px 18px 6px}
.tcard.list .k{color:var(--label2);opacity:1}
.tcard.list h3{max-width:none;margin-bottom:8px}
.padart{display:grid;grid-template-columns:repeat(4,1fr);align-content:center;gap:9px;padding:118px 44px 92px;background:#0B0B0F}
.padart i{border-radius:12px;aspect-ratio:1;opacity:.28;animation:padBeat 1.9s infinite;animation-delay:var(--d)}
@keyframes padBeat{0%,100%{opacity:.25}12%{opacity:1;box-shadow:0 0 24px -2px currentColor}40%{opacity:.4}}

/* rows & pills */
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;position:relative}
.arow+.arow::before{content:"";position:absolute;top:0;left:76px;right:0;border-top:.5px solid var(--sep)}
.arow .ic{width:64px;flex:none}
.arow .t{flex:1;min-width:0}
.arow .t b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.arow .t small{display:block;font-size:13px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;min-width:74px;text-align:center;padding:6px 14px;border-radius:99px;background:var(--fill);color:var(--blue);font-size:15px;font-weight:700;letter-spacing:-.01em}
.pill.solid{background:var(--blue);color:#fff}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:calc(100% - 28px);grid-template-rows:repeat(3,auto);column-gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:max(20px,env(safe-area-inset-left,0px));margin:0 calc(-1 * max(20px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start}
.hs.big{grid-template-rows:auto;grid-auto-columns:calc(100% - 28px)}
.gcard{position:relative;border-radius:16px;overflow:hidden;height:250px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.gcard canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.gcard .cap{padding:16px 18px}
.gcard .k{font-size:12px;font-weight:600;text-transform:uppercase;color:rgba(255,255,255,.7)}
.gcard h3{font-family:var(--f-sysd);font-size:23px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.gcard p{margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.75);max-width:28ch}
.gcard .foot{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.gcard .foot .ic{width:36px}
.gcard .foot div{flex:1;min-width:0;font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .foot .pill{background:rgba(255,255,255,.25);color:#fff;min-width:0}

/* icons */
.ic{display:block;width:100%;aspect-ratio:1;border-radius:22.37%;position:relative;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.ic svg{width:100%;height:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 18px;padding:4px 2px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;text-decoration:none;color:inherit}
.app .ic{max-width:64px;box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 .5px rgba(0,0,0,.08)}
.app b{font-weight:400;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.app:active .ic{transform:scale(.92);filter:brightness(.85)}
.app .ic{transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .2s}
.folder .ic{background:var(--fill);display:grid;grid-template-columns:1fr 1fr;gap:9%;padding:14%;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:none}
.folder .ic i{border-radius:22%;overflow:hidden;display:block}
.folder .ic i svg{width:100%;height:100%}
.letter{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-sysd);font-weight:700;font-size:28px;color:#fff;letter-spacing:-.03em}
.addic{border:1.5px dashed var(--label3);box-shadow:none!important;display:grid!important;place-items:center;color:var(--label2);font-size:30px;font-weight:300;background:transparent}
.app .x{position:absolute;top:-7px;left:calc(50% - 39px);width:22px;height:22px;border-radius:50%;background:var(--label2);color:var(--bg);font-size:15px;line-height:22px;text-align:center;z-index:2}
.app.wig .ic{animation:wig .28s infinite alternate}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.groupcard{background:var(--card);border-radius:14px;padding:4px 16px}
.foottxt{margin-top:30px;font-size:13px;color:var(--label2);line-height:1.45;text-align:center;padding:0 12px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .25s}
@keyframes fade{from{opacity:0}}
.scrim.blur{background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%)}
.fold{width:100%;max-width:330px;color:#fff;text-align:center}
.fold h4{font-family:var(--f-sysd);font-size:32px;font-weight:700;margin:0 0 18px;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.2)}
.fold .box{background:rgba(255,255,255,.22);border-radius:36px;padding:24px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;animation:pop .4s cubic-bezier(.2,1,.3,1.1);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fold .app b{color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:14px 14px 0 0;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;animation:up .45s cubic-bezier(.2,.9,.25,1);max-height:90%;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:9px;background:var(--label3);margin:0 auto 14px}
.closex{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--label2);display:grid;place-items:center}
.sh-head{display:flex;gap:16px;align-items:center;padding-top:10px}
.sh-head .ic{width:108px;flex:none}
.sh-head h5{font-family:var(--f-sysd);font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sh-head small{display:block;color:var(--label2);font-size:15px;margin-top:2px}
.open{display:inline-block;margin-top:14px;font-weight:700;padding:6px 20px;border-radius:99px;background:var(--blue);color:#fff;text-decoration:none;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 4px;border-block:.5px solid var(--sep)}
.facts div{padding:10px 4px;text-align:center}
.facts div+div{border-left:.5px solid var(--sep)}
.facts em{display:block;font-style:normal;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--label3);letter-spacing:.02em}
.facts strong{display:block;font-family:var(--f-sysd);font-size:17px;font-weight:700;color:var(--label2);margin-top:4px}
.sheet h6{font-family:var(--f-sysd);font-size:20px;font-weight:700;margin:20px 0 0}
.sheet p{font-size:15px;line-height:1.45;margin:6px 0 0}
.note{font-size:13px;color:var(--label2);margin-top:12px;line-height:1.4}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-top:14px}
.presets .ic{max-width:58px}
.field{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:10px;border:0;background:var(--fill);color:var(--label);font:inherit;font-size:17px}
.field::placeholder{color:var(--label3)}
.lbl2{font-size:13px;text-transform:uppercase;color:var(--label2);margin:22px 4px 0;display:block}
.btn-s{margin-top:14px;width:100%;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:17px}
.edit-link{font-size:17px;color:var(--blue)}
@media (min-width:600px){.hs{grid-auto-columns:calc(50% - 8px)}.hs.big{grid-auto-columns:calc(50% - 8px)}}
/* ---------- extras: search button, banner, profile, look, spotlight ---------- */
.ltb{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.sbtn{width:38px;height:38px;border-radius:50%;background:var(--fill);color:var(--label);display:grid;place-items:center}
.avatar{margin-bottom:0}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.haswall body{background:transparent}
.haswall #store{position:relative;z-index:1}
.haswall .groupcard,.haswall .tcard.list{background:color-mix(in srgb,var(--card) 62%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.haswall .hdr{border-top-color:transparent}
.haswall .hdr small,.haswall .lt .date{color:color-mix(in srgb,var(--label) 70%,transparent)}
.haswall .pill:not(.solid){background:color-mix(in srgb,var(--card) 55%,transparent)}
.haswall .sbtn{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.ban{position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:min(380px,calc(100% - 20px));display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:color-mix(in srgb,var(--card) 78%,transparent);color:var(--label);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.25);animation:banIn .6s cubic-bezier(.2,1.2,.3,1);cursor:pointer;font-family:var(--f-sys)}
.ban.out{transition:transform .45s cubic-bezier(.6,0,.8,.4),opacity .45s;transform:translate(-50%,-140%);opacity:0}
@keyframes banIn{from{transform:translate(-50%,-140%)}}
.ban .bi{width:38px;height:38px;border-radius:10px;background:var(--fill);display:grid;place-items:center;flex:none}
.ban .bi svg{width:24px;height:24px}
.ban div{min-width:0}
.ban small{display:block;font-size:12px;color:var(--label2);font-weight:500}
.ban b{display:block;font-size:15px;font-weight:600}
.ban span{display:block;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof{display:flex;align-items:center;gap:16px;padding:14px 0 6px}
.ring{width:96px;height:96px;position:relative;flex:none}
.ring>svg{width:100%;height:100%}

.ring span svg{width:100%;height:100%;display:block}

.setrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;background:var(--fill);margin-top:16px;text-align:left}

.cnt{font-size:15px;font-weight:500;color:var(--label2);margin-left:6px}
.tro{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tr{background:var(--fill);border-radius:14px;padding:12px;opacity:.6;min-width:0}
.tr.on{opacity:1}

.tr b{display:block;font-size:14px;font-weight:600;margin-top:6px}
.tr small{display:block;font-size:12px;color:var(--label2);line-height:1.3;margin-top:2px}
.tr em{display:block;font-style:normal;font-size:11px;color:var(--label3);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.shh{font-family:var(--f-sysd);font-size:26px;font-weight:700;margin:6px 0 0;letter-spacing:-.02em}

.wopt{display:flex;flex-direction:column;align-items:center;gap:6px}

.acc{width:34px;height:34px;border-radius:50%}

.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}

.grouprow{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--fill);margin-top:22px;font-size:16px}
.sw{width:51px;height:31px;border-radius:99px;background:var(--label3);position:relative;transition:background .25s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.sw.on{background:#34C759}
.sw.on i{transform:translateX(20px)}
.spot{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);overflow-y:auto;animation:fade .25s;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.spbar{display:flex;gap:12px;align-items:center;max-width:640px;margin:0 auto}
.spf{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:11px;padding:0 10px;color:var(--label2);animation:spIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes spIn{from{transform:scale(.92);opacity:0}}
.spf input{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);padding:10px 0;outline:none;min-width:0}
.spf input::-webkit-search-cancel-button{opacity:.5}
.spx{font-size:17px;color:var(--blue);flex:none}
.spres{max-width:640px;margin:0 auto}
.sph{font-family:var(--f-sysd);font-size:20px;font-weight:700;margin:24px 2px 10px;letter-spacing:-.015em}
.spm{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.spres .arow .ic{width:48px}
.spres .arow.hit .ic{width:64px}
.spres .arow+.arow::before{left:60px}
.spres a.pill{text-decoration:none}
.sic{border-radius:22.37%}
.spnone{text-align:center;padding:80px 20px;color:var(--label2)}
.spnone b{display:block;font-size:22px;color:var(--label);font-family:var(--f-sysd);margin-bottom:4px}
/* animated icons */
.animicons .ic[data-i] svg *{transform-box:view-box}
.animicons .ic[data-i]::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.animicons .grid .app:nth-child(3n+1) .ic::after{animation-delay:1.2s}
.animicons .grid .app:nth-child(3n+2) .ic::after{animation-delay:3.1s}
@keyframes sheen{0%,80%{transform:translateX(-120%)}95%,100%{transform:translateX(120%)}}
.animicons .ic[data-i="ascendant"] svg path:nth-of-type(2){animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.animicons .ic[data-i="azimut"] svg path:nth-of-type(2),.animicons .ic[data-i="azimut"] svg path:nth-of-type(3){transform-origin:50px 52px;animation:needle 4s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.animicons .ic[data-i="velours"] svg path{transform-origin:50px 22px;animation:spark 2.2s ease-in-out infinite}
@keyframes spark{50%{transform:scale(1.35) rotate(45deg)}}
.animicons .ic[data-i="nocta"] svg g{transform-origin:50px 50px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.animicons .ic[data-i="champion"] svg circle{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.animicons .ic[data-i="ciel"] svg circle{animation:bob 3s ease-in-out infinite}
.animicons .ic[data-i="frequence"] svg path{stroke-dasharray:240;animation:wave 2.6s linear infinite}
@keyframes wave{from{stroke-dashoffset:480}to{stroke-dashoffset:0}}
.animicons .ic[data-i="frequence"] svg circle{animation:twinkle 1s steps(2) infinite}
.animicons .ic[data-i="volta"] svg rect:nth-of-type(n+2){animation:twinkle 1.8s ease-in-out infinite}
.animicons .ic[data-i="volta"] svg rect:nth-of-type(3){animation-delay:.45s}
.animicons .ic[data-i="volta"] svg rect:nth-of-type(4){animation-delay:.9s}
.animicons .ic[data-i="volta"] svg rect:nth-of-type(5){animation-delay:1.35s}
.animicons .ic[data-i="bastion"] svg path:nth-of-type(3){transform-origin:50px 22px;animation:flag 1.4s ease-in-out infinite}
@keyframes flag{50%{transform:scaleX(.7)}}
.animicons .ic[data-i="mafia"] svg{animation:tilt 3.4s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-4deg) translateY(-1px)}}
.animicons .ic[data-i="studio"] svg g rect{animation:twinkle 2s ease-in-out infinite}
.animicons .ic[data-i="studio"] svg g rect:nth-child(2){animation-delay:.5s}
.animicons .ic[data-i="studio"] svg g rect:nth-child(3){animation-delay:1s}
.animicons .ic[data-i="studio"] svg g rect:nth-child(4){animation-delay:1.5s}
.animicons .ic[data-i="qg"] svg text{animation:tilt 3s ease-in-out infinite;transform-origin:50px 50px}
/* ---------- TYCOON ---------- */
#game{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--g-bg);color:var(--g-fg);font-family:var(--g-body)}
#game .wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(60px + env(safe-area-inset-bottom,0px))}
.g-top{display:flex;align-items:center;gap:10px}
.g-back{width:38px;height:38px;border-radius:12px;border:1px solid var(--g-line);display:grid;place-items:center;flex:none}
.g-title{flex:1;min-width:0}
.g-title b{display:block;font-family:var(--g-disp);font-size:22px;line-height:1;letter-spacing:var(--g-ls,0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-title small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-acc)}
.g-hud{margin-top:12px;border:1px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel);padding:14px;position:relative;overflow:hidden}
.g-hud::before{content:"";position:absolute;inset:0;background:var(--g-art);opacity:.55;pointer-events:none}
.g-hud>*{position:relative}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:84px}
.chip em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-mute)}
.chip b{display:block;font-family:var(--g-disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--g-mute)}
.chip.hot b{color:#FF6A55}
.g-rank{margin-top:12px;font-size:12.5px;color:var(--g-mute);display:flex;justify-content:space-between;gap:8px}
.g-rank b{color:var(--g-fg)}
.bar{height:4px;background:var(--g-line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g-acc);width:0;transition:width .4s}
.bar.heat i{background:linear-gradient(90deg,#C9A15B,#E0663F 70%,#FF3B30)}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--g-line)}
.tabs button{padding:10px 10px;font-size:14px;font-weight:600;color:var(--g-mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--g-fg);border-color:var(--g-acc)}
.tabs button i{font-style:normal;display:inline-block;min-width:17px;height:17px;border-radius:9px;background:var(--g-acc);color:var(--g-on);font-size:10.5px;line-height:17px;text-align:center;margin-left:5px;vertical-align:1px}
.hint{font-size:12.5px;color:var(--g-mute);margin:0 2px 10px;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--g-line);background:var(--g-panel);border-radius:var(--g-r);padding:12px}
.card h6{margin:0;font-size:15px;font-weight:600}
.card .meta{font-family:var(--f-mono);font-size:11px;color:var(--g-mute);margin-top:4px;line-height:1.5}
.card .row2{display:flex;align-items:center;gap:10px}
.card .row2>div{flex:1;min-width:0}
.btn{flex:none;border-radius:calc(var(--g-r) * .7 + 2px);padding:9px 12px;background:var(--g-fg);color:var(--g-bg);font-family:var(--f-mono);font-size:12px;font-weight:600;line-height:1.2;text-align:center}
.btn small{display:block;font-weight:400;font-size:10px;opacity:.7}
.btn.acc{background:var(--g-acc);color:var(--g-on)}
.btn.ghost{background:transparent;color:var(--g-fg);border:1px solid var(--g-line)}
.btn:disabled{background:transparent;color:var(--g-mute);border:1px solid var(--g-line);opacity:.8}
.btn.wide{width:100%;padding:12px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .btn{flex:1}
.pbar{height:6px;background:var(--g-line);border-radius:6px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--g-acc);width:0}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--g-line);color:var(--g-mute);vertical-align:2px}
.tag.ok{color:#8FD694;border-color:#8FD69455}
.tag.bad{color:#FF7A66;border-color:#FF7A6655}
.tag.acc{color:var(--g-acc);border-color:var(--g-acc)}
.glyph{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* bastion map */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border:1px solid var(--g-line);border-radius:var(--g-r);background:
  linear-gradient(rgba(210,176,76,.06) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,rgba(210,176,76,.06) 1px,transparent 1px) 0 0/20px 20px,var(--g-panel)}
.tile{aspect-ratio:1;border-radius:3px;border:1px dashed var(--g-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:var(--g-acc);min-width:0}
.tile.b{border-style:solid;background:#232819}
.tile.b span{font-family:var(--f-mono);font-size:9.5px;color:var(--g-fg);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.tile.empty{color:var(--g-mute);font-size:20px;font-weight:300}
.tile.lock{opacity:.25;border-style:dotted}
.tile em{position:absolute;top:2px;left:4px;font-style:normal;font-family:var(--f-mono);font-size:9.5px;color:var(--g-mute)}
.tile .up{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--g-acc);color:var(--g-on);font-size:10px;line-height:14px;text-align:center;font-weight:700}
.tile.boosted{box-shadow:inset 0 0 0 1px rgba(210,176,76,.55)}
/* mafia city */
.city{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--g-line);background:#0D0908;border-radius:var(--g-r)}
.dist{aspect-ratio:1/0.9;border-radius:2px;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0;background:var(--c,#2a1d19);color:#F0E4CF}
.dist b{font-size:12.5px;font-weight:600;line-height:1.15}
.dist small{font-family:var(--f-mono);font-size:10px;opacity:.8;line-height:1.35}
.dist.me{background:linear-gradient(160deg,#5A3F1B,#3A2812);box-shadow:inset 0 0 0 1.5px var(--g-acc)}
.dist.near{box-shadow:inset 0 0 0 1px rgba(240,228,207,.4)}
.dist.far{opacity:.55}
.dist .slots{display:flex;gap:3px}
.dist .slots i{width:8px;height:8px;border-radius:50%;border:1px solid rgba(240,228,207,.6)}
.dist .slots i.on{background:var(--g-acc);border-color:var(--g-acc)}
/* sheet inside games */
.gsheet-scrim{position:fixed;inset:0;z-index:52;background:rgba(0,0,0,.55)}
.gsheet{position:fixed;left:0;right:0;bottom:0;z-index:53;max-width:560px;margin:0 auto;background:var(--g-bg);border:1px solid var(--g-line);border-bottom:0;border-radius:18px 18px 0 0;max-height:82%;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.gsheet h5{font-family:var(--g-disp);font-size:22px;margin:-30px 80px 4px 0;letter-spacing:var(--g-ls,0)}
.gsheet p{font-size:13.5px;line-height:1.5;color:var(--g-mute);margin:0 0 12px}
.gsheet .grab{background:var(--g-line)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--g-line);border-radius:var(--g-r);padding:10px 12px;background:var(--g-panel)}
.opt:disabled{opacity:.45}
.opt .ico{width:38px;height:38px;flex:none;border:1px solid var(--g-line);border-radius:calc(var(--g-r) * .7);display:grid;place-items:center;color:var(--g-acc)}
.opt div{flex:1;min-width:0}
.opt b{display:block;font-size:14px}
.opt small{display:block;font-size:12px;color:var(--g-mute);margin-top:2px;line-height:1.35}
.opt .px{font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{padding:8px 11px;border-radius:999px;border:1px solid var(--g-line);font-size:13px;color:var(--g-mute)}
.seg button.on{background:var(--g-fg);color:var(--g-bg);border-color:var(--g-fg)}
.seg button:disabled{opacity:.35}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-mute);margin-top:6px}
.stars{color:var(--g-acc);letter-spacing:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--g-fg);color:var(--g-bg);padding:12px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up2 .25s}
@keyframes up2{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.modal .card2{background:var(--g-bg);border:1px solid var(--g-line);border-radius:var(--g-r);padding:22px;max-width:340px;width:100%;text-align:center}
.modal .card2 small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-mute)}
.modal .card2 b{display:block;font-family:var(--g-disp);font-size:30px;color:var(--g-acc);margin:8px 0}
.modal .card2 div{font-size:13.5px;color:var(--g-mute);line-height:1.5}
.modal .card2 button{margin-top:14px;width:100%;padding:13px;border-radius:var(--g-r);background:var(--g-acc);color:var(--g-on);font-family:var(--g-disp);font-size:16px}

/* themes per tycoon */
.th-bastion{--g-bg:#14170F;--g-panel:#1B1F15;--g-fg:#E6E1CF;--g-mute:#99977F;--g-line:#30352A;--g-acc:#D2B04C;--g-on:#14170F;--g-r:4px;--g-disp:"Saira Condensed","Arial Narrow",sans-serif;--g-body:var(--f-body);--g-ls:.02em;
  --g-art:repeating-radial-gradient(circle at 85% 20%,transparent 0 13px,rgba(210,176,76,.12) 13px 14px)}
.th-bastion .g-title b,.th-bastion .gsheet h5{text-transform:uppercase}
.th-mafia{--g-bg:#140E0D;--g-panel:#1C1412;--g-fg:#F0E4CF;--g-mute:#A08F7A;--g-line:#3A2A23;--g-acc:#C9A15B;--g-on:#140E0D;--g-r:2px;--g-disp:"Limelight",Georgia,serif;--g-body:var(--f-body);--g-ls:.01em;
  --g-art:repeating-conic-gradient(from 180deg at 50% 120%,rgba(201,161,91,.13) 0 2deg,transparent 2deg 12deg)}
.th-studio{--g-bg:#0C0E14;--g-panel:#121521;--g-fg:#E8ECF6;--g-mute:#8790A8;--g-line:#232840;--g-acc:#6E8BFF;--g-on:#0C0E14;--g-r:14px;--g-disp:"Familjen Grotesk",sans-serif;--g-body:var(--f-body);--g-ls:-.02em;
  --g-art:linear-gradient(rgba(110,139,255,.09) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(110,139,255,.09) 1px,transparent 1px) 0 0/16px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* logo + intro */
#intro{position:fixed;inset:0;z-index:100;background:#121316;color:#ECE8DF;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:introOut .7s cubic-bezier(.75,0,.2,1) 2.75s forwards;overflow:hidden}
#intro::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(125,140,255,.22),transparent 65%);opacity:0;animation:halo 1.6s ease 1s forwards}
@keyframes halo{to{opacity:1}}
#intro.skip{animation:introOut .45s cubic-bezier(.75,0,.2,1) forwards}
@keyframes introOut{to{transform:translateY(-100%);border-radius:0 0 48px 48px}}
.ibox{position:relative;display:flex;flex-direction:column;align-items:center}
.ig{display:grid;grid-template-columns:repeat(3,30px);gap:8px;animation:igMove .6s cubic-bezier(.3,1.4,.5,1) 1.15s both}
@keyframes igMove{from{transform:scale(1)}50%{transform:scale(.9)}to{transform:scale(1)}}
.it{width:30px;height:30px;border-radius:8px;background:#ECE8DF;opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.5);animation:tileIn .75s cubic-bezier(.2,1.25,.4,1) var(--d) forwards}
@keyframes tileIn{to{opacity:1;transform:none}}
.it.no{background:#34363D;animation:tileIn .75s cubic-bezier(.2,1.25,.4,1) var(--d) forwards,tileOut .35s ease-in 1.05s forwards}
@keyframes tileOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.1) rotate(45deg)}}
.it.c{background:#7D8CFF;animation:tileIn .75s cubic-bezier(.2,1.25,.4,1) var(--d) forwards,glow 1.2s ease 1.45s}
@keyframes glow{40%{box-shadow:0 0 0 6px rgba(125,140,255,.25),0 0 34px rgba(125,140,255,.9)}}
.iw{margin-top:26px;display:flex;overflow:hidden;font-family:var(--f-disp);font-weight:700;font-size:42px;letter-spacing:-.035em;line-height:1.1;padding-bottom:4px}
.iw span{display:inline-block;transform:translateY(110%);animation:wUp .6s cubic-bezier(.2,1,.3,1) var(--d) forwards}
.iw span.s{color:#7D8CFF}
@keyframes wUp{to{transform:none}}
.itag{margin-top:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9A978F;opacity:0;animation:fadeIn .6s ease 2.05s forwards}
@keyframes fadeIn{to{opacity:1}}
.ihint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:10.5px;color:#5E5C57;letter-spacing:.1em;text-transform:uppercase}

/* ================= APP STORE LAYER (v6) ================= */
:root{--spring:cubic-bezier(.2,.9,.25,1);--glass:rgba(255,255,255,.62);--glassline:rgba(255,255,255,.75);--glassshadow:0 8px 32px -6px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.06);--card2:#fff;--chip:rgba(118,118,128,.12)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.012 1%,.05 2.2%,.2 5%,.58 11.6%,.78 16.2%,.9 20.8%,.97 25.6%,1.01 30.6%,1.025 36%,1.02 43%,1.006 55%,1)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(40,40,44,.62);--glassline:rgba(255,255,255,.14);--glassshadow:0 8px 32px -6px rgba(0,0,0,.7);--card2:#1C1C1E}}
:root[data-theme="dark"]{--glass:rgba(40,40,44,.62);--glassline:rgba(255,255,255,.14);--glassshadow:0 8px 32px -6px rgba(0,0,0,.7);--card2:#1C1C1E}
#store{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));transition:transform .55s var(--spring),filter .55s}
#store.under{transform:translateX(-26%);filter:brightness(.9)}
.paged body,.storied body{overflow:hidden}
.lt{padding:6px 0 2px}
.lt .date{font-size:13px;letter-spacing:.02em}
.lt h1{font-size:34px;letter-spacing:.012em;font-weight:700}

/* floating glass tab bar */
.tabbar{left:50%;right:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 32px),460px);padding:0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;gap:10px;align-items:stretch;justify-content:center;z-index:28;transition:transform .5s var(--spring),opacity .3s}
.storied .tabbar{transform:translate(-50%,140%);opacity:0}
.tbpill,.tbsearch{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassshadow),inset 0 0 0 .5px var(--glassline),inset 0 1px 0 var(--glassline)}
.tbpill{flex:1;display:flex;position:relative;border-radius:999px;padding:4px;height:62px}
.tabbar .tbpill button{flex:1;max-width:none;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;color:var(--label);padding:0;transition:color .3s}
.tabbar .tbpill button.on{color:var(--blue)}
.tabbar svg{width:25px;height:25px}
.tbind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--chip);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s var(--spring),opacity .25s}
.tabbar.nosel .tbind{opacity:0}
.tabbar .tbsearch{flex:none;max-width:62px;padding:0;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--label);transition:color .3s,transform .3s var(--spring)}
.tbsearch svg{width:23px;height:23px}
.tabbar .tbsearch.on{color:var(--blue)}
.tbsearch:active,.tbpill button:active{transform:scale(.92)}

/* sections */
.hdr{margin:28px 0 10px;padding-top:16px}
.hdr h2{font-size:22px;letter-spacing:.005em}
.hlink{display:inline-flex;align-items:center;gap:4px;font:inherit}
.hlink .chev{width:17px;height:17px;color:var(--label3)}
.chev{width:16px;height:16px;color:var(--label3);flex:none}

/* rows */
.arow{cursor:pointer;-webkit-user-select:none;user-select:none}
.arow .t b{font-size:16px;font-weight:500}
.arow .rk{flex:none;width:18px;font-family:var(--f-sysd);font-size:17px;font-weight:600;text-align:center;color:var(--label)}
.arow:has(.rk)+.arow::before{left:94px}
.arow .ic{width:62px}
a.pill{text-decoration:none}
.pill{min-width:76px;padding:6px 15px;font-size:15px;font-weight:700;transition:transform .25s var(--spring),filter .2s}
.pill:active{transform:scale(.9);filter:brightness(.9)}
.pill.solid{background:var(--blue);color:#fff}
.pill.sm{min-width:0;padding:4px 14px;font-size:14px}
.pill.glass{background:rgba(255,255,255,.24);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hs.rows3{grid-template-rows:repeat(3,auto)}
.groupcard.plain{background:transparent;padding:0}

/* Today cards */
.today{gap:30px;margin-top:12px}
.tcard{border-radius:20px;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:0 16px 40px -18px rgba(0,0,0,.45),0 2px 6px -2px rgba(0,0,0,.12)}
.tcard.press{transition:transform .5s var(--spring)}
.tcard.press:active{transform:scale(.965);transition-duration:.18s}
.tcard .cap{padding:22px 22px 0}
.tcard .k{font-size:13px;font-weight:600;letter-spacing:.01em;opacity:.72;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.tcard h3{font-size:30px;line-height:1.06;letter-spacing:-.01em;max-width:13ch;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.tcard .foot{padding:14px 18px;background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.tcard .foot .ic{width:46px;box-shadow:0 0 0 .5px rgba(255,255,255,.2)}
.tcard.list{background:var(--card2);padding:22px 18px 8px}
.tcard.list .cap{padding:0 4px 6px}
.tcard.list .k{text-shadow:none}
.tcard.list h3{text-shadow:none;max-width:none;margin-bottom:6px}
.tcard.list .arow .ic{width:56px}
.tcard.list .arow+.arow::before{left:68px}

/* CSS art */
.cielart{background:linear-gradient(180deg,#22386A 0%,#5E5C8E 38%,#C77D7A 68%,#F2C46A 100%);overflow:hidden}
.cielart .sun{position:absolute;left:50%;top:62%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,#FFF4D6 0%,#FFD48A 45%,rgba(255,200,120,0) 70%);animation:sunr 9s ease-in-out infinite alternate}
@keyframes sunr{to{transform:translateY(-26px) scale(1.06)}}
.cielart .cl{position:absolute;height:44px;border-radius:44px;background:rgba(255,255,255,.55);filter:blur(10px)}
.cielart .c1{width:200px;left:-40px;top:42%;animation:drift 16s linear infinite}
.cielart .c2{width:150px;right:-30px;top:30%;opacity:.7;animation:drift 22s linear infinite reverse}
.cielart .c3{width:260px;left:20%;top:80%;opacity:.5;animation:drift 19s linear infinite}
@keyframes drift{50%{transform:translateX(40px)}}
.noctart{background:radial-gradient(120% 80% at 50% 45%,#2A3566 0%,#141B33 60%,#0B1022 100%);display:grid;place-items:center}
.noctart .ring{width:58%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(244,224,77,.6);position:relative;margin-top:14%;animation:spin 26s linear infinite}
.noctart .ring b{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;margin:-8%;border-radius:50%;background:var(--c);box-shadow:0 0 24px var(--c);transform:rotate(var(--a)) translateY(-312%) }
.noctart span{position:absolute;top:56%;left:0;right:0;text-align:center;font-family:var(--f-sysd);font-weight:800;font-size:30px;letter-spacing:.12em;color:#fff;opacity:.9}

/* banners (Apps / Jeux) */
.hs.bn{grid-template-rows:auto;margin-top:10px;padding-bottom:4px}
.bnr{display:block;text-align:left;cursor:pointer;min-width:0;padding-top:12px;border-top:.5px solid var(--sep)}
.bnr .be{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.03em}
.bnr h3{font-family:var(--f-sysd);font-size:22px;font-weight:600;margin:2px 0 0;letter-spacing:-.005em}
.bnr p{margin:1px 0 0;font-size:17px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bart{position:relative;margin-top:10px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:radial-gradient(120% 120% at 15% 10%,var(--c2) 0%,var(--c1) 70%);isolation:isolate;transition:transform .5s var(--spring)}
.bnr:active .bart{transform:scale(.97)}
.bart .ph{position:absolute;width:34%;border-radius:12px;box-shadow:0 18px 40px -10px rgba(0,0,0,.6),0 0 0 4px #0b0b0d,0 0 0 4.6px rgba(255,255,255,.18)}
.bart .p1{right:9%;top:12%;transform:rotate(4deg)}
.bart .p2{right:36%;top:22%;transform:rotate(-5deg);opacity:.85;width:30%}
.bart .bic{position:absolute;left:7%;bottom:9%;width:22%}
.bart .bic .ic{box-shadow:0 10px 30px -6px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.2)}
.bart:not(:has(.ph)) .bic{left:39%;bottom:auto;top:50%;transform:translateY(-50%)}

/* game cards */
.gcard{cursor:pointer}

/* search tab */
.sfield{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--fill);color:var(--label2);font-size:17px;text-align:left}
.disc{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.disc button{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:19px;color:var(--blue);text-align:left;border-bottom:.5px solid var(--sep)}
.disc svg{color:var(--label3);flex:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;align-items:flex-start;position:relative;height:96px;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;text-align:left;padding:12px 14px}
.cat b{font-family:var(--f-sysd);font-size:19px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cat span{position:absolute;right:10px;bottom:10px;display:flex;transform:rotate(-10deg)}
.cat span .ic{width:50px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.25)}

/* pushed pages */
.page{position:fixed;inset:0;z-index:26;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .55s var(--spring),filter .55s;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.haswall .page{background:var(--bg)}
.page.in{transform:none}
.page.out{transform:translateX(100%);transition:transform .42s cubic-bezier(.3,.7,.2,1)}
.page.under{transform:translateX(-26%);filter:brightness(.9)}
.pnav{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));transition:background .25s,box-shadow .25s}
.page.scrolled .pnav{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.pback{display:flex;align-items:center;gap:0;color:var(--blue);font-size:17px;min-width:0;max-width:40%;padding:8px 4px}
.pback span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmid{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);width:32px;margin-left:-16px;opacity:0;transform:translateY(6px) scale(.8);transition:opacity .25s,transform .4s var(--spring)}
.pright{opacity:0;transform:scale(.8);transition:opacity .25s,transform .4s var(--spring);pointer-events:none}
.page.mini .pmid,.page.mini .pright{opacity:1;transform:none;pointer-events:auto}
.page.list .pmid{display:none}
.pin{max-width:640px;margin:0 auto;padding:4px max(20px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.plt{font-family:var(--f-sysd);font-size:34px;font-weight:700;margin:4px 0 8px}
.plead{color:var(--label2);margin:-4px 0 10px;font-size:15px}
.dhead{display:flex;gap:16px;align-items:stretch;padding-top:6px}
.dhead>.ic{width:118px;flex:none;box-shadow:0 0 0 .5px var(--sep)}
.dt{display:flex;flex-direction:column;min-width:0;flex:1}
.dt h1{font-family:var(--f-sysd);font-size:24px;font-weight:600;line-height:1.15;margin:2px 0 0;letter-spacing:.005em}
.dt p{margin:2px 0 0;color:var(--label2);font-size:15px;line-height:1.3}
.dact{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.dact .pill{padding:7px 22px}
.share{color:var(--blue);padding:4px}
.istrip{display:flex;overflow-x:auto;scrollbar-width:none;margin:22px calc(-1 * max(20px,env(safe-area-inset-right,0px))) 0;padding:0 max(20px,env(safe-area-inset-right,0px));border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep)}
.istrip::-webkit-scrollbar{display:none}
.ic2{flex:none;min-width:106px;padding:12px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.ic2+.ic2{border-left:.5px solid var(--sep)}
.ic2 em{font-style:normal;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--label3);letter-spacing:.03em}
.ic2 strong{font-family:var(--f-sysd);font-size:20px;font-weight:700;color:var(--label2);line-height:1.2;height:26px;display:flex;align-items:center}
.ic2 strong .cg{font-size:15px}
.ic2 small{font-size:12px;color:var(--label3)}
.stars{display:inline-flex;gap:1px}
.stars i{width:11px;height:11px;color:var(--label3)}
.stars i.on{color:var(--label2)}
.stars svg{width:100%;height:100%;fill:currentColor}
.dsec{border-top:.5px solid var(--sep);margin-top:22px;padding-top:16px}
.dsec:first-of-type{border-top:0}
.sh2 h2{font-family:var(--f-sysd);font-size:22px;font-weight:700;margin:0 0 10px}
.news small{color:var(--label2);font-size:14px}
.news p{margin:6px 0 0;font-size:15px;line-height:1.45}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding:0 max(20px,env(safe-area-inset-right,0px));scroll-padding:0 max(20px,env(safe-area-inset-left,0px))}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;scroll-snap-align:start;border-radius:22px;overflow:hidden;box-shadow:0 0 0 .5px var(--sep);transition:transform .4s var(--spring)}
.shot:active{transform:scale(.97)}
.shots .shot{width:min(58vw,250px)}
.shot img{display:block;width:100%;aspect-ratio:390/844;object-fit:cover;background:var(--fill)}
.dev2{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--label2);font-size:14px}
.dsc p{margin:0;font-size:15px;line-height:1.47;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dsc{position:relative}
.dsc .more{position:absolute;right:0;bottom:0;color:var(--blue);font-size:15px;background:linear-gradient(90deg,transparent,var(--bg) 30%);padding-left:36px}
.dsc.full p{-webkit-line-clamp:unset;display:block}
.dsc.full .more{display:none}
.devrow{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;text-align:left}
.devrow b{display:block;color:var(--blue);font-size:15px;font-weight:400}
.devrow small{display:block;color:var(--label2);font-size:13px}
.rate{display:flex;gap:18px;align-items:center}
.rate .big{text-align:center}
.rate .big b{display:block;font-family:var(--f-sysd);font-size:58px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--label2)}
.rate .big small{font-size:15px;font-weight:600;color:var(--label2)}
.rbars{flex:1;display:flex;flex-direction:column;gap:3px}
.rbars div{display:flex;align-items:center;gap:8px}
.rbars span{width:46px;text-align:right;font-size:9px;letter-spacing:-.5px;color:var(--label2);line-height:1}
.rbars i{flex:1;height:3px;border-radius:3px;background:var(--fill);overflow:hidden}
.rbars u{display:block;height:100%;background:var(--label2);border-radius:3px;transition:width .6s var(--spring)}
.rbars small{align-self:flex-end;color:var(--label2);font-size:13px;margin-top:4px}
.tap{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:.5px solid var(--sep);font-size:15px;color:var(--label2)}
.stars.big{gap:6px}
.stars.big button{width:30px;height:30px;color:var(--blue);padding:0}
.stars.big svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stars.big button.on svg{fill:currentColor}
.stars.big button.pop{animation:spop .5s var(--spring)}
@keyframes spop{30%{transform:scale(1.35)}}
.infos div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.infos span{color:var(--label2)}
.infos b{font-weight:400;text-align:right}
.tip{font-size:13px;color:var(--label2);line-height:1.4;margin-top:12px}

/* story (expanded Today card) */
.story{position:fixed;inset:0;z-index:40}
.sdim{position:absolute;inset:0;background:rgba(0,0,0,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .4s}
.story.open .sdim{opacity:1}
.sbox{position:fixed;overflow:hidden;background:var(--card2);color:var(--label);box-shadow:0 20px 60px rgba(0,0,0,.35);will-change:top,left,width,height}
.sscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.shero{border-radius:0!important;box-shadow:none!important;cursor:default}
.shero .foot{transition:opacity .3s}
.story.open .shero .foot{opacity:0;pointer-events:none}
.shero .cap{padding-top:calc(22px + env(safe-area-inset-top,0px))}
.shero.list{padding-bottom:0}
.sbody{color:var(--label);max-width:640px;margin:0 auto;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));opacity:0;transform:translateY(16px);transition:opacity .35s .12s,transform .6s .08s var(--spring)}
.story.open .sbody{opacity:1;transform:none}
.story.closing .sbody{transition:opacity .15s;opacity:0}
.sbody p{font-size:19px;line-height:1.42;color:var(--label2);margin:0 0 18px;letter-spacing:-.01em}
.sbody p b{color:var(--label);font-weight:600}
.sbody .lead{font-size:21px;font-weight:600;color:var(--label);line-height:1.3}
.sfig{margin:6px 0 24px;display:flex;justify-content:center}
.sfig .shot{width:min(66%,280px);border-radius:26px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5),0 0 0 .5px var(--sep)}
.sapp{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto auto;column-gap:14px;align-items:center;margin-top:26px;padding:18px;border-radius:18px;background:var(--fill)}
.sapp .ic{grid-row:1/3;width:64px}
.sapp b{font-size:17px;font-weight:600;align-self:end}
.sapp small{color:var(--label2);font-size:13px;align-self:start;grid-column:2}
.sapp .pill{grid-row:1/3;grid-column:3}
.sapp .link{grid-column:1/4;margin-top:12px;color:var(--blue);font-size:15px;text-align:center}
.sshare{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:28px;padding:14px;border-radius:14px;background:var(--fill);color:var(--blue);font-size:17px;font-weight:600}
.sshare svg{width:20px;height:20px}
.sclose{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--label);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glassline);opacity:0;transform:scale(.6);transition:opacity .3s .15s,transform .5s .15s var(--spring)}
.story.open .sclose{opacity:1;transform:none}
.story.closing .sclose{transition:opacity .1s;opacity:0}

/* screenshot viewer */
.lb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;animation:fade .25s}
.lb.out{transition:opacity .25s;opacity:0}
.lbbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.lbbar button{color:var(--blue);font-size:17px;font-weight:600;width:60px;text-align:left}
.lbbar b{font-size:17px;font-weight:600}
.lbbar span{width:60px}
.lbs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lbs::-webkit-scrollbar{display:none}
.lbs div{flex:none;width:100%;scroll-snap-align:center;display:grid;place-items:center;padding:6px 24px calc(20px + env(safe-area-inset-bottom,0px))}
.lbs img{max-width:100%;max-height:100%;border-radius:26px;box-shadow:0 0 0 .5px var(--sep)}

@media (prefers-reduced-motion: reduce){.page,.tcard.press,.tbind,.sbody,#store{transition:none!important}.cielart *,.noctart .ring,.padart i{animation:none!important}}
@media (min-width:600px){.hs.bn{grid-auto-columns:calc(50% - 8px)}.cats{grid-template-columns:repeat(4,1fr)}}

/* ================= APPLE STORE LAYER (v7) ================= */
:root{--bg:#F5F5F7;--label:#1D1D1F;--label2:#6E6E73;--label3:#86868B;--blue:#0071E3;--card:#FFFFFF;--card2:#FFFFFF;--hot:#B64400;--sep:rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--label:#F5F5F7;--label2:#A1A1A6;--label3:#6E6E73;--blue:#2997FF;--card:#1D1D1F;--card2:#1D1D1F;--hot:#FF9F0A;--sep:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#000;--label:#F5F5F7;--label2:#A1A1A6;--label3:#6E6E73;--blue:#2997FF;--card:#1D1D1F;--card2:#1D1D1F;--hot:#FF9F0A;--sep:rgba(255,255,255,.14)}
body{letter-spacing:-.022em}
.lt h1{font-size:40px;font-weight:600;letter-spacing:-.03em}
.lt .date{text-transform:none;font-size:15px;font-weight:500;color:var(--label3);letter-spacing:-.01em}
.lt .date::first-letter{text-transform:uppercase}
.avatar{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hdr{border-top:0;margin-top:34px}
.hdr h2{font-size:24px;font-weight:600;letter-spacing:-.025em}
.hdr h2+small,.hdr small{font-size:15px}
.hdr .link,.link{color:var(--blue)}
.pill{font-weight:500;font-size:15px;letter-spacing:-.01em;padding:6px 16px;min-width:72px}

/* ---------- HELPERS ---------- */
var SUF=["","k","M","Md","Bn","Bd","Tn","Td","Qn","Qd"];
function fmt(n){
 if(!isFinite(n))return "∞";var neg=n<0;n=Math.abs(n);var r;
 if(n<1000)r=n<10&&n%1?n.toFixed(1).replace(".",","):Math.floor(n).toLocaleString("fr-FR");
 else{var e=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3)),v=n/Math.pow(1000,e);r=(e===SUF.length-1&&v>=1000)?n.toExponential(2).replace(".",","):(v<100?v.toFixed(2):v.toFixed(1)).replace(".",",")+" "+SUF[e]}
 return (neg?"−":"")+r;
}
function fmtTime(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+" h "+(m<10?"0":"")+m:m?m+" min "+(x<10?"0":"")+x:x+" s"}
function fmtDur(min){return min>=60?(min/60)+" h":min+" min"}
function rand(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rand(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function gl(d){return '<svg class="glyph" viewBox="0 0 24 24"><path d="'+d+'"/></svg>'}
function rankBar(list,score,thr){ // thr: ascending thresholds same length as list
 var i=0;while(i<list.length-1&&score>=thr[i+1])i++;
 var p=i===list.length-1?1:clamp((score-thr[i])/(thr[i+1]-thr[i]),0,1);
 return {name:list[i],next:list[i+1],p:p,i:i};
}

function bUpCost(t,lv){return BT[t].cost*Math.pow(2.4,lv)}
function bAdj(i){var r=[],x=i%COLS;if(x>0)r.push(i-1);if(x<COLS-1)r.push(i+1);r.push(i-COLS,i+COLS);return r}
function bLv(S,t){var m=0;S.tiles.forEach(function(x){if(x&&x.t===t)m=Math.max(m,x.lv)});return m}
function bTileProd(S,i){
 var x=S.tiles[i];if(!x||!BT[x.t].prod)return 0;
 var b=1;bAdj(i).forEach(function(j){var y=S.tiles[j];if(y&&y.t==="mess")b+=BT.mess.boost*y.lv});
 return BT[x.t].prod*x.lv*Math.pow(1.35,x.lv-1)*b*(1+bLv(S,"qg")*BT.qg.all);
}
function bProd(S){var t=0;for(var i=0;i<S.tiles.length;i++)t+=bTileProd(S,i);return t}
function bCap(S){var c=3;S.tiles.forEach(function(x){if(x&&BT[x.t].cap)c+=BT[x.t].cap*x.lv});return c}
function bBusy(S){return S.mis.reduce(function(a,m){return a+(m.end?m.need:0)},0)}
function bChance(S,tier){var c=.6-tier*.05;S.tiles.forEach(function(x){if(x&&x.t==="stand")c+=BT.stand.chance*x.lv});return clamp(c,.1,.97)}
function bTier(S){return bLv(S,"piste")?2:bLv(S,"hangar")?1:0}
function bOffer(S){
 var mt=bTier(S),tier=Math.random()<.6?mt:ri(0,mt);
 var durs=[[1,3,5,10,20,30],[10,20,30,60,90],[30,60,90,120,180]][tier],dur=pick(durs);
 var cap=bCap(S),need=Math.max(2,Math.min(Math.round(cap*rand(.25,.7)),Math.ceil((2+dur*.35)*(1+tier))));
 var p=Math.max(1,bProd(S));
 return {nm:pick(B_MIS[tier]),tier:tier,dur:dur,need:need,rew:Math.round(p*dur*60*(.55+tier*.35)+40*dur*(1+tier)),xp:Math.ceil((1+dur/6)*(1+tier)),end:0};
}

  if(!STARS){STARS=[];for(var i=0;i<160;i++)STARS.push([Math.random(),Math.random(),Math.random()*1.3+.3,Math.random()*6])}

  c.globalAlpha=1;blob(c,W*.8,H*.15,m*.35,"rgba(120,110,255,.18)");return}
 if(type==="ocean"){var g2=c.createLinearGradient(0,0,0,H);g2.addColorStop(0,"#021627");g2.addColorStop(1,"#063A5C");c.fillStyle=g2;c.fillRect(0,0,W,H);

 if(type==="dune"){var g3=c.createLinearGradient(0,0,0,H);g3.addColorStop(0,"#FBE3C8");g3.addColorStop(1,"#F2B488");c.fillStyle=g3;c.fillRect(0,0,W,H);blob(c,W*.75,H*.18,m*.25,"rgba(255,255,255,.7)");
  var cols=["#EDB07E","#E29A6A","#D6845A","#C8714C"];for(var d=0;d<4;d++){c.beginPath();var b=H*(.55+d*.12);c.moveTo(0,H);for(var x2=0;x2<=W;x2+=8)c.lineTo(x2,b+Math.sin(x2/(160-d*20)+d*2+t*.05)*(24-d*3));c.lineTo(W,H);c.closePath();c.fillStyle=cols[d];c.globalAlpha=.75;c.fill()}c.globalAlpha=1;return}
 if(type==="brume"){c.fillStyle="#EEF0F7";c.fillRect(0,0,W,H);
  blob(c,W*(.2+.1*Math.sin(t*.1)),H*.2,m*.55,"rgba(255,182,193,.55)");blob(c,W*.85,H*(.4+.1*Math.cos(t*.08)),m*.5,"rgba(173,216,255,.6)");blob(c,W*(.5+.2*Math.cos(t*.06)),H*.9,m*.55,"rgba(200,190,255,.55)");return}
 c.fillStyle="#141416";c.fillRect(0,0,W,H);blob(c,W*(.5+.3*Math.sin(t*.05)),H*.3,m*.7,"rgba(255,255,255,.07)");

 var right=x.href?'<a class="pill" data-go="1" '+(x.track?'data-track="'+x.track+'" ':"")+'href="'+esc(x.href)+'"'+(/^https?:|^apps\//.test(x.href)?' target="_blank" rel="noopener"':"")+'>'+x.btn+'</a>':'<button class="pill" data-go="1" '+x.act+'>'+(x.btn||"Ouvrir")+'</button>';
 return '<div class="arow'+(big?" hit":"")+'"><button class="spm" '+(x.act||'data-noop="1"')+'>'+x.html+'<span class="t"><b>'+esc(x.n)+'</b><small>'+esc(x.sub)+'</small></span></button>'+right+'</div>';
}
function renderSearch(qs){
 var el=$("#spres"),q=norm(qs.trim()),items=searchItems();
 if(!q){
  var s=stats(),top=APPS.slice().sort(function(a,b){return (s.opens[b.id]||0)-(s.opens[a.id]||0)}).slice(0,4);
  el.innerHTML='<div class="sph">Suggestions</div><div class="grid">'+top.map(function(a){return '<button class="app" data-app="'+a.id+'">'+icn(a.id)+'<b>'+a.name+'</b></button>'}).join("")+'</div><div class="sph">Raccourcis</div><div class="groupcard">'+items.filter(function(x){return x.k==="Raccourcis"}).map(function(x){return hitRow(x)}).join("")+'</div>';return}
 var scored=items.map(function(x){var n=norm(x.n),sc=n.indexOf(q)===0?3:n.indexOf(q)>=0?2:norm(x.kw+" "+x.sub).indexOf(q)>=0?1:0;return [sc,x]}).filter(function(a){return a[0]>0}).sort(function(a,b){return b[0]-a[0]});
 if(!scored.length){el.innerHTML='<div class="spnone"><b>Aucun résultat</b><span>pour « '+esc(qs)+' »</span></div>';return}
 var h='<div class="sph">Meilleur résultat</div><div class="groupcard">'+hitRow(scored[0][1],true)+'</div>',groups={};
 scored.slice(1).forEach(function(a){(groups[a[1].k]=groups[a[1].k]||[]).push(a[1])});
 Object.keys(groups).forEach(function(k){h+='<div class="sph">'+k+'</div><div class="groupcard">'+groups[k].map(function(x){return hitRow(x)}).join("")+'</div>'});
 el.innerHTML=h;
}

/* ---------- EVENTS for extras ---------- */
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-search],[data-profile],[data-custom],[data-wall],[data-accent],[data-mode],[data-anim],[data-track],.grid a.app");if(!t)return;
 if(t.dataset.track){trackOpen(t.dataset.track);return}
 if(t.matches(".grid a.app")){bump("phoneOpens");return}
 if(t.dataset.search){openSearch();return}
 if(t.dataset.profile){openProfile();return}
 if(t.dataset.custom){openCustom();return}
 if(t.dataset.wall){setLook("wall",t.dataset.wall);if(t.dataset.wall!=="none")bump("wall");openCustom();setTimeout(checkTrophies,400);return}
 if(t.dataset.accent){setLook("accent",t.dataset.accent);openCustom();return}
 if(t.dataset.mode){if(t.disabled)return;setLook("mode",t.dataset.mode);openCustom();return}
 if(t.dataset.anim){setLook("anim",!(look().anim!==false));openCustom();return}
},true);
/* ---------- GAME SHELL ---------- */
var cur=null,GM=null,S=null,tab=null,tick=null,lastT=0,lastSig="",lastSave=0,sheetFn=null;
function openGame(id,skipHash){
 closeOverlay();cur=id;GM=GAMES[id];S=gload(id);tab=GM.tabs[0][0];sheetFn=null;
 var gm=$("#game");gm.className=GM.cls;gm.hidden=false;document.body.style.overflow="hidden";
 gm.innerHTML='<div class="wrap"><div class="g-top"><button class="g-back" data-back="1" aria-label="Retour au store"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><div class="g-title"><small>Pop · Tycoon</small><b>'+GM.full+'</b></div></div>'
  +'<div class="g-hud"><div class="chips" id="gTop"></div><div class="g-rank"><span>Rang : <b id="gRank"></b></span><span id="gNext"></span></div><div class="bar"><i id="gBar"></i></div></div>'
  +'<div class="tabs" id="gTabs"></div><div id="gBody"></div></div><div id="gSheet"></div>';
 // offline
 var wasNew=S.isNew;delete S.isNew;
 var away=Math.min(8*3600,(Date.now()-(S.last||Date.now()))/1000);
 if(!wasNew&&away>20){var c0=S.cash,steps=Math.ceil(away/5),dt=away/steps;for(var k=0;k<steps;k++)GM.step(S,dt);var gain=S.cash-c0;var af=GM.after&&GM.after(S);
  showModal(["Pendant ton absence ("+fmtTime(away)+")",(gain>=0?"+":"")+fmt(gain)+" "+GM.unit,id==="bastion"?"Ta base a tourné sans toi. Pense à récupérer tes missions.":id==="mafia"?"Tes affaires ont tourné."+(af?" Attention : il y a eu une descente de police.":""):"Tes applis ont continué d'être téléchargées."]);}
 else if(wasNew){showModal(["Nouvelle partie",GM.full,{bastion:"Construis ta base case par case, puis envoie tes soldats en mission. Pas besoin de cliquer en boucle : tout tourne tout seul.",mafia:"Tu tiens un seul quartier. Ouvre des affaires, recrute des hommes, prends les quartiers voisins et surveille la police.",studio:"Lance une petite appli, embauche une équipe et grimpe le classement du Store jusqu'à la première place."}[id]],"C'est parti")}
 if(!skipHash)try{history.pushState({g:id},"","#"+id)}catch(e){location.hash=id}
 gsave(id,S);renderTabs();renderBody(true);
 lastT=performance.now();clearInterval(tick);tick=setInterval(loop,500);
}
function closeGame(){if(!cur)return;gsave(cur,S);clearInterval(tick);cur=null;$("#game").hidden=true;$("#game").innerHTML="";document.body.style.overflow="";renderStore()}
function loop(){
 var now=performance.now(),dt=Math.min(2,(now-lastT)/1000);lastT=now;
 GM.step(S,dt);var af=GM.after&&GM.after(S);if(af)handle(af);
 renderTop();
 var sg=GM.sig(S,tab);if(sg!==lastSig)renderBody();
 live();
 if(Date.now()-lastSave>4000){gsave(cur,S);lastSave=Date.now();checkTrophies()}
}
function renderTop(){
 $("#gTop").innerHTML=GM.top(S);var r=GM.rank(S);$("#gRank").textContent=r.name;$("#gNext").textContent=r.next?"→ "+r.next:"Sommet atteint";$("#gBar").style.width=(r.p*100).toFixed(1)+"%";
 var bs=document.querySelectorAll("#gTabs [data-tab]");bs.forEach(function(b){var n=GM.badge(S,b.dataset.tab);var i=b.querySelector("i");if(n&&!i){i=document.createElement("i");b.appendChild(i)}if(i){if(n)i.textContent=n;else i.remove()}});
}
function renderTabs(){$("#gTabs").innerHTML=GM.tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</button>'}).join("");renderTop()}
function renderBody(){lastSig=GM.sig(S,tab);$("#gBody").innerHTML=GM.body(S,tab);live()}
function live(){
 var now=Date.now();
 document.querySelectorAll("#game [data-cd]").forEach(function(e){e.textContent=fmtTime((+e.dataset.cd-now)/1000)});
 document.querySelectorAll("#game [data-pg]").forEach(function(e){var p=e.dataset.pg.split("|");e.style.width=clamp((now-p[0])/(p[1]-p[0]),0,1)*100+"%"});
 if(GM.live)GM.live(S);
}
function showModal(m,btn){var d=document.createElement("div");d.className="modal";d.innerHTML='<div class="card2"><small>'+m[0]+'</small><b>'+m[1]+'</b><div>'+m[2]+'</div><button data-x="1">'+(btn||"Ok")+'</button></div>';$("#game").appendChild(d)}
function openGSheet(html){$("#gSheet").innerHTML='<div class="gsheet-scrim" data-gclose="1"></div><div class="gsheet" role="dialog"><div style="display:flex;justify-content:flex-end"><button class="btn ghost" data-gclose="1" style="padding:6px 10px">Fermer</button></div>'+html+'</div>'}
function closeGSheet(){$("#gSheet").innerHTML="";sheetFn=null}
function handle(r){
 if(!r)return;
 if(r.close)closeGSheet();
 if(r.sheet){openGSheet(r.sheet)}
 if(r.reopen){var x=GM.act(S,r.reopen[0],r.reopen[1]);if(x&&x.sheet)openGSheet(x.sheet)}
 if(r.toast)toast(r.toast);
 if(r.modal){closeGSheet();showModal(r.modal)}
 gsave(cur,S);lastSave=Date.now();renderTop();renderBody();
}
function toast(t){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.textContent=t;$("#game").appendChild(d);setTimeout(function(){d.remove()},2200)}

/* ---------- EVENTS ---------- */
document.addEventListener("click",function(e){
 var t=e.target.closest("button,[data-close],[data-gclose]");if(!t)return;
 if(t.dataset.close&&(e.target===t||t.classList.contains("closex"))){closeOverlay();return}
 if(t.dataset.gclose){closeGSheet();return}
 if(t.dataset.folder){openFolder();return}
 if(t.dataset.add){openAdd();return}
 if(t.dataset.edit){editMode=!editMode;renderStore();return}
 if(t.dataset.rm!==undefined){var l=myApps();l.splice(+t.dataset.rm,1);setMyApps(l);if(!l.length)editMode=false;renderStore();return}
 if(t.dataset.preset){var p=PRESETS.filter(function(x){return x[0]===t.dataset.preset})[0];var l2=myApps();l2.push({n:p[0],u:p[1],c:p[2]});setMyApps(l2);closeOverlay();renderStore();return}
 if(t.dataset.addcustom){var n=$("#addName").value.trim(),u=normLink($("#addUrl").value);if(!n||!u){$("#addName").focus();return}var l3=myApps();l3.push({n:n.slice(0,20),u:u,c:COLORS[l3.length%COLORS.length]});setMyApps(l3);closeOverlay();renderStore();return}
 if(t.dataset.app){openApp(t.dataset.app);return}
 if(t.dataset.game){openGame(t.dataset.game);return}
 if(t.dataset.back){if(location.hash){history.back()}else closeGame();return}
 if(!cur)return;
 if(t.dataset.x){t.closest(".modal").remove();return}
 if(t.dataset.tab){tab=t.dataset.tab;closeGSheet();renderTabs();renderBody();$("#game").scrollTop=Math.min($("#game").scrollTop,140);return}
 if(t.dataset.a){if(t.disabled)return;handle(GM.act(S,t.dataset.a,t.dataset.v));return}
});
window.addEventListener("popstate",function(){var h=location.hash.slice(1);if(GAMES[h]&&!cur)openGame(h,true);else if(!GAMES[h]&&cur)closeGame()});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(GAMES[h]&&cur!==h){if(cur)closeGame();openGame(h,true)}else if(!GAMES[h]&&cur)closeGame()});
document.addEventListener("visibilitychange",function(){if(!cur)return;if(document.hidden)gsave(cur,S);else{var away=(Date.now()-S.last)/1000;if(away>2){var steps=Math.ceil(away/5);for(var k=0;k<steps;k++)GM.step(S,away/steps);lastT=performance.now()}}});
window.addEventListener("pagehide",function(){if(cur)gsave(cur,S)});
window.addEventListener("resize",function(){if(!cur){var b=$(".feat");drawFeat(b?b.dataset.game:"bastion")}});

/* ---------- LOGO + INTRO ---------- */
/* Pop mark: a glossy soap bubble on a bubblegum gradient, with two little bubbles. */
function popDefs(){return '<defs><linearGradient id="ppB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset=".55" stop-color="#FF4D6D"/><stop offset="1" stop-color="#FF9A3C"/></linearGradient><radialGradient id="ppU" cx=".42" cy=".38" r=".62"><stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".72" stop-color="#fff" stop-opacity=".22"/><stop offset=".86" stop-color="#9FF3FF" stop-opacity=".75"/><stop offset=".93" stop-color="#FFE38A" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></radialGradient></defs>'}
function bubble(cx,cy,r,cls){return '<g class="'+(cls||"")+'"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#ppU)"/><ellipse cx="'+(cx-r*.36)+'" cy="'+(cy-r*.4)+'" rx="'+(r*.3)+'" ry="'+(r*.17)+'" transform="rotate(-35 '+(cx-r*.36)+' '+(cy-r*.4)+')" fill="#fff" fill-opacity=".9"/><circle cx="'+(cx+r*.42)+'" cy="'+(cy+r*.44)+'" r="'+(r*.07)+'" fill="#fff" fill-opacity=".8"/></g>'}
function limaLogo(bg){return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+popDefs()+(bg?'<rect width="100" height="100" fill="url(#ppB)"/>':"")+bubble(46,54,28)+bubble(77,26,9)+bubble(24,20,5.5)+'</svg>'}
function playIntro(){
 if(REDUCE||GAMES[location.hash.slice(1)])return;
 var b="",dr="";
 for(var i=0;i<22;i++){var s=Math.round(rand(10,46));b+='<i class="pb" style="--x:'+rand(0,100).toFixed(1)+'%;--s:'+s+'px;--d:'+rand(0,1.1).toFixed(2)+'s;--t:'+rand(1.6,2.8).toFixed(2)+'s;--w:'+rand(-30,30).toFixed(0)+'px"></i>'}
 for(var k=0;k<14;k++){var a=k/14*Math.PI*2,r=rand(90,150);dr+='<i class="pd" style="--dx:'+(Math.cos(a)*r).toFixed(0)+'px;--dy:'+(Math.sin(a)*r).toFixed(0)+'px;--s:'+rand(5,12).toFixed(0)+'px"></i>'}
 var h='<div id="lintro" class="pop" role="presentation"><div class="pbs">'+b+'</div><div class="lstage"><div class="pbig"><svg viewBox="0 0 100 100">'+popDefs()+bubble(50,50,46)+'</svg></div><div class="pring2"></div><div class="pdrops">'+dr+'</div>'
  +'<div class="pword2">'+"pop".split("").map(function(c,k){return '<span style="--k:'+k+'">'+c+'</span>'}).join("")+'</div><div class="ptag2">Toutes tes apps, en un pop.</div></div></div>';
 document.body.insertAdjacentHTML("beforeend",h);document.documentElement.classList.add("intro");
 var el=document.getElementById("lintro"),gone=false;
 function end(){if(gone)return;gone=true;el.classList.add("out");document.documentElement.classList.remove("intro");setTimeout(function(){el.remove()},800)}
 el.addEventListener("click",end);setTimeout(end,3300);
}

applyLook();trackDay();renderStore();playIntro();setTimeout(checkTrophies,3200);
var h0=location.hash.slice(1);if(GAMES[h0])openGame(h0,true);
})();
</script>
