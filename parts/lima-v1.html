<title>Lima Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Limelight&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: phone launcher. Store = paper shelf with app tiles; each tycoon = its own full-screen dark world. */
:root{
  --paper:#ECE8DF; --card:#F7F4EE; --ink:#16181B; --mute:#6B6A66; --line:#D6D1C6; --accent:#2B44E8;
  --f-disp:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141518;--card:#1D1F23;--ink:#ECE8DF;--mute:#9A978F;--line:#2C2E33;--accent:#7D8CFF;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141518;--card:#1D1F23;--ink:#ECE8DF;--mute:#9A978F;--line:#2C2E33;--accent:#7D8CFF;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- STORE ---------- */
#store{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:560px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.word{font-family:var(--f-disp);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.035em;margin-top:6px}
.word i{font-style:normal;color:var(--accent)}
.mono-badge{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:-.04em;flex:none}
.rule{height:1px;background:var(--line);margin:18px 0 0}
.feat{margin-top:18px;border-radius:20px;overflow:hidden;position:relative;color:#F3EEE4;background:#17140F;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;width:100%}
.feat canvas{position:absolute;inset:0;width:100%;height:100%}
.feat>*:not(canvas){position:relative}
.feat .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.feat h2{font-family:var(--f-disp);font-size:27px;line-height:1.02;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.feat p{font-size:13.5px;opacity:.82;margin:0;max-width:30ch}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec h3{font-family:var(--f-disp);font-size:19px;letter-spacing:-.01em;margin:0}
.sec span{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.ic{width:100%;max-width:70px;aspect-ratio:1;border-radius:22%;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.45);transition:transform .15s}
.app:active .ic{transform:scale(.93)}
.ic svg{width:100%;height:100%;display:block}
.app b{font-weight:500;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .ic{background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;grid-template-columns:1fr 1fr;gap:7%;padding:13%;box-shadow:none;backdrop-filter:blur(8px)}
.folder .ic i{border-radius:22%;overflow:hidden;display:block}
.folder .ic i svg{width:100%;height:100%}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:18px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:52px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:600}
.row .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{font-family:var(--f-disp);font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none}
.foot{margin-top:28px;font-size:12px;color:var(--mute);line-height:1.5}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.fold{width:100%;max-width:340px;color:#fff;text-align:center}
.fold h4{font-family:var(--f-disp);font-size:30px;margin:0 0 16px;letter-spacing:-.02em}
.fold .box{background:rgba(255,255,255,.16);border-radius:30px;padding:22px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.fold .app b{color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-head .ic{width:86px;flex:none}
.sh-head h5{font-family:var(--f-disp);font-size:24px;margin:0;letter-spacing:-.02em}
.sh-head small{color:var(--mute);font-size:13px}
.open{display:inline-block;margin-top:10px;font-family:var(--f-disp);font-weight:700;padding:8px 22px;border-radius:99px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 4px;border-block:1px solid var(--line)}
.facts div{padding:10px 4px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.facts strong{font-family:var(--f-disp);font-size:15px}
.sheet p{font-size:14.5px;line-height:1.55;margin:14px 0 0}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}

/* ---------- TYCOON ---------- */
#game{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--g-bg);color:var(--g-fg);font-family:var(--g-body)}
#game .wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(96px + env(safe-area-inset-bottom,0px))}
.g-top{display:flex;align-items:center;gap:10px}
.g-back{width:38px;height:38px;border-radius:12px;border:1px solid var(--g-line);display:grid;place-items:center;flex:none}
.g-title{flex:1;min-width:0}
.g-title b{display:block;font-family:var(--g-disp);font-size:22px;line-height:1;letter-spacing:var(--g-ls,0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-title small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-acc)}
.g-hud{margin-top:14px;border:1px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel);padding:16px;position:relative;overflow:hidden}
.g-hud::before{content:"";position:absolute;inset:0;background:var(--g-art);opacity:.55;pointer-events:none}
.g-hud>*{position:relative}
.g-cash{font-family:var(--g-disp);font-size:40px;line-height:1;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.g-sub{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--g-mute)}
.g-sub b{color:var(--g-fg);font-weight:500}
.g-rank{margin-top:12px}
.g-rank .bar{height:4px;background:var(--g-line);border-radius:4px;overflow:hidden;margin-top:6px}
.g-rank .bar i{display:block;height:100%;background:var(--g-acc);width:0;transition:width .3s}
.g-rank span{font-size:12.5px;color:var(--g-mute)}
.g-rank span b{color:var(--g-fg)}
.tap{margin-top:12px;width:100%;border-radius:var(--g-r);background:var(--g-acc);color:var(--g-on);font-family:var(--g-disp);font-size:20px;padding:16px;letter-spacing:var(--g-ls,0);position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;justify-content:space-between;align-items:center}
.tap small{font-family:var(--f-mono);font-size:12px;opacity:.8}
.tap:active{filter:brightness(.92)}
.fly{position:fixed;pointer-events:none;font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--g-acc);z-index:50;animation:fly .8s ease-out forwards;text-shadow:0 1px 6px rgba(0,0,0,.6)}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.boost{margin-top:12px;border:1px dashed var(--g-acc);border-radius:var(--g-r);padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--g-fg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{border-color:transparent}}
.boost b{font-family:var(--g-disp);font-size:16px;display:block}
.boost small{color:var(--g-mute);font-size:12px}
.boost .go{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--g-acc)}
.active-boost{margin-top:10px;font-family:var(--f-mono);font-size:12px;color:var(--g-acc)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--g-line)}
.tabs button{padding:10px 8px;font-size:14px;font-weight:600;color:var(--g-mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--g-fg);border-color:var(--g-acc)}
.mult{margin-left:auto;display:flex;gap:4px;align-self:center}
.mult button{font-family:var(--f-mono);font-size:11.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--g-line);margin:0;color:var(--g-mute)}
.mult button.on{background:var(--g-fg);color:var(--g-bg);border-color:var(--g-fg)}
.b-list{display:flex;flex-direction:column;gap:8px}
.b{display:flex;gap:12px;align-items:center;border:1px solid var(--g-line);background:var(--g-panel);border-radius:var(--g-r);padding:11px 12px}
.b.lock{opacity:.45}
.b .gl{width:42px;height:42px;flex:none;border-radius:calc(var(--g-r) * .7);border:1px solid var(--g-line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--g-acc);position:relative}
.b .gl svg{width:24px;height:24px;stroke:var(--g-acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.b .gl em{position:absolute;right:-6px;bottom:-6px;font-style:normal;background:var(--g-fg);color:var(--g-bg);font-size:10px;padding:1px 5px;border-radius:6px;font-weight:600}
.b .mid{flex:1;min-width:0}
.b .mid b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .mid small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--g-mute);margin-top:3px}
.b .mid .pr{height:3px;background:var(--g-line);border-radius:3px;margin-top:6px;overflow:hidden}
.b .mid .pr i{display:block;height:100%;background:var(--g-acc);opacity:.7}
.buy{flex:none;min-width:84px;text-align:right;border-radius:calc(var(--g-r) * .7);padding:8px 10px;background:var(--g-fg);color:var(--g-bg);font-family:var(--f-mono);font-size:12px;font-weight:600;line-height:1.25}
.buy small{display:block;font-weight:400;font-size:10px;opacity:.7}
.buy:disabled{background:transparent;color:var(--g-mute);border:1px solid var(--g-line)}
.u-desc{font-size:12px;color:var(--g-mute);margin-top:3px}
.empty{padding:22px 10px;text-align:center;color:var(--g-mute);font-size:13.5px;border:1px dashed var(--g-line);border-radius:var(--g-r)}
.pres{border:1px solid var(--g-line);border-radius:var(--g-r);background:var(--g-panel);padding:18px}
.pres h6{font-family:var(--g-disp);font-size:22px;margin:0 0 6px;letter-spacing:var(--g-ls,0)}
.pres p{font-size:14px;line-height:1.55;color:var(--g-mute);margin:0 0 12px}
.pres .big{font-family:var(--g-disp);font-size:34px;color:var(--g-acc)}
.pres button.cta{margin-top:12px;width:100%;padding:14px;border-radius:var(--g-r);background:var(--g-acc);color:var(--g-on);font-family:var(--g-disp);font-size:17px}
.pres button.cta:disabled{opacity:.35}
.pres .confirm{display:flex;gap:8px;margin-top:10px}
.pres .confirm button{flex:1;padding:12px;border-radius:var(--g-r);border:1px solid var(--g-line);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{border:1px solid var(--g-line);border-radius:calc(var(--g-r) * .7);padding:10px}
.stats em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--g-mute)}
.stats b{font-family:var(--f-mono);font-size:14px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--g-fg);color:var(--g-bg);padding:12px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up2 .25s}
@keyframes up2{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.modal .card{background:var(--g-bg);border:1px solid var(--g-line);border-radius:var(--g-r);padding:22px;max-width:340px;width:100%;text-align:center}
.modal .card small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-mute)}
.modal .card b{display:block;font-family:var(--g-disp);font-size:34px;color:var(--g-acc);margin:8px 0}
.modal .card button{margin-top:14px;width:100%;padding:13px;border-radius:var(--g-r);background:var(--g-acc);color:var(--g-on);font-family:var(--g-disp);font-size:16px}

/* themes per tycoon */
.th-bastion{--g-bg:#14170F;--g-panel:#1B1F15;--g-fg:#E6E1CF;--g-mute:#99977F;--g-line:#30352A;--g-acc:#D2B04C;--g-on:#14170F;--g-r:4px;--g-disp:"Saira Condensed","Arial Narrow",sans-serif;--g-body:var(--f-body);--g-ls:.02em;
  --g-art:repeating-radial-gradient(circle at 85% 20%,transparent 0 13px,rgba(210,176,76,.12) 13px 14px)}
.th-bastion .g-title b,.th-bastion .tap,.th-bastion .pres h6{text-transform:uppercase}
.th-mafia{--g-bg:#140E0D;--g-panel:#1C1412;--g-fg:#F0E4CF;--g-mute:#A08F7A;--g-line:#3A2A23;--g-acc:#C9A15B;--g-on:#140E0D;--g-r:2px;--g-disp:"Limelight",Georgia,serif;--g-body:var(--f-body);--g-ls:.01em;
  --g-art:repeating-conic-gradient(from 180deg at 50% 120%,rgba(201,161,91,.13) 0 2deg,transparent 2deg 12deg)}
.th-mafia .g-cash{color:#F0E4CF}
.th-studio{--g-bg:#0C0E14;--g-panel:#121521;--g-fg:#E8ECF6;--g-mute:#8790A8;--g-line:#232840;--g-acc:#6E8BFF;--g-on:#0C0E14;--g-r:14px;--g-disp:"Familjen Grotesk",sans-serif;--g-body:var(--f-body);--g-ls:-.02em;
  --g-art:linear-gradient(rgba(110,139,255,.09) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(110,139,255,.09) 1px,transparent 1px) 0 0/16px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="store"></div>
<div id="game" hidden></div>
<div id="overlay"></div>

var GROWTH=1.15, MILESTONES=[10,25,50,100,150,200,300,400,500];
function upgradesFor(id){
 var g=G[id],u=[];

/* ---------- FORMAT ---------- */
var SUF=["","k","M","Md","Bn","Bd","Tn","Td","Qn","Qd"];
function fmt(n){
 if(!isFinite(n))return "∞";
 if(n<1000)return n<10&&n%1?n.toFixed(1).replace(".",","):Math.floor(n).toLocaleString("fr-FR");
 var e=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3)),v=n/Math.pow(1000,e);
 if(e===SUF.length-1&&v>=1000)return n.toExponential(2).replace(".",",");
 return (v<100?v.toFixed(2):v.toFixed(1)).replace(".",",")+" "+SUF[e];
}
function fmtTime(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" h "+m+" min":m?m+" min":s+" s"}

/* ---------- GAME STATE ---------- */
function fresh(){return {cash:0,life:0,total:0,own:BASE_COST.map(function(){return 0}),up:{},pts:0,taps:0,last:Date.now(),boostEnd:0,started:Date.now(),resets:0}}
function load(id){var s=store.get("lima."+id);if(!s)return fresh();var f=fresh();for(var k in f)if(s[k]===undefined)s[k]=f[k];return s}
function save(id,s){s.last=Date.now();store.set("lima."+id,s)}

function bMult(id,s,i){
 var m=1,o=s.own[i];
 MILESTONES.forEach(function(t){if(o>=t)m*=2});
 upgradesFor(id).forEach(function(u){if(s.up[u.id]&&u.eff.b===i)m*=u.eff.m});
 return m;
}
function gMult(id,s){
 var m=1+s.pts*.05;
 upgradesFor(id).forEach(function(u){if(s.up[u.id]&&u.eff.all)m*=u.eff.all});
 return m;
}
function income(id,s,noBoost){
 var t=0;for(var i=0;i<BASE_INC.length;i++)t+=s.own[i]*BASE_INC[i]*bMult(id,s,i);
 t*=gMult(id,s);
 if(!noBoost&&s.boostEnd>Date.now())t*=7;
 return t;
}
function tapValue(id,s){
 var m=1;upgradesFor(id).forEach(function(u){if(s.up[u.id]&&u.eff.tap)m*=u.eff.tap});
 return (1+income(id,s)*.04)*m*(1+s.pts*.05);
}
function costOf(i,owned,n){var c=BASE_COST[i]*Math.pow(GROWTH,owned);return c*(Math.pow(GROWTH,n)-1)/(GROWTH-1)}
function maxBuy(i,owned,cash){var c=BASE_COST[i]*Math.pow(GROWTH,owned);var n=Math.floor(Math.log(cash*(GROWTH-1)/c+1)/Math.log(GROWTH));return Math.max(0,n)}
function rankOf(id,s){
 var r=G[id].ranks,lvl=s.life<=0?0:Math.max(0,Math.floor(Math.log10(Math.max(1,s.life))/1.6)),i=Math.min(r.length-1,lvl);
 var lo=Math.pow(10,i*1.6),hi=Math.pow(10,(i+1)*1.6);
 var p=i===r.length-1?1:Math.min(1,Math.max(0,(Math.log10(Math.max(1,s.life))-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))));
 return {i:i,name:r[i],next:r[i+1],p:p,hi:hi};
}
function presGain(s){return Math.max(0,Math.floor(Math.sqrt(s.life/1e7))-0)}

  +featHTML
  +'<div class="sec"><h3>Mes apps</h3><span>'+(APPS.length+3)+' apps · 1 dossier</span></div><div class="grid">'+grid+'</div>'
  +'<div class="sec"><h3>Dossier Tycoon</h3><span>hors ligne</span></div><div class="list">'+["bastion","mafia","studio"].map(function(id){var s=load(id);return '<button class="row" data-game="'+id+'"><span class="ic">'+ICON[id]+'</span><span class="t"><b>'+G[id].full+'</b><small>'+(s.life>0?rankOf(id,s).name+" · "+fmt(s.cash)+" "+G[id].unit:G[id].tag)+'</small></span><span class="get">Jouer</span></button>'}).join("")+'</div>'
  +'<div class="sec"><h3>Toutes les apps</h3><span>A → Z</span></div><div class="list">'+list+'</div>'
  +'<div class="foot">Lima Store regroupe les applis créées par Seven. Les tycoons sauvegardent ta partie sur ce téléphone et continuent de gagner pendant ton absence (jusqu\'à 8 h).</div>';
 drawFeat(best?best.id:"bastion");
}
function drawFeat(id){
 var cv=$("#featCv");if(!cv)return;var r=cv.getBoundingClientRect(),dp=Math.min(2,devicePixelRatio||1);cv.width=r.width*dp;cv.height=r.height*dp;
 var c=cv.getContext("2d");c.scale(dp,dp);var w=r.width,h=r.height;
 var pal={bastion:["#1B1F15","#2A2F1F","#D2B04C"],mafia:["#1C1412","#3A2320","#C9A15B"],studio:["#0E1120","#1B2140","#6E8BFF"]}[id];
 var gr=c.createLinearGradient(0,0,w,h);gr.addColorStop(0,pal[1]);gr.addColorStop(1,pal[0]);c.fillStyle=gr;c.fillRect(0,0,w,h);
 c.strokeStyle=pal[2];c.globalAlpha=.35;c.lineWidth=1;
 if(id==="bastion"){for(var k=0;k<9;k++){c.beginPath();for(var x=0;x<=w;x+=8){var y=30+k*16+Math.sin(x/40+k)*8+Math.sin(x/17+k*2)*3;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}}
 else if(id==="mafia"){for(var a=0;a<28;a++){c.beginPath();c.moveTo(w*.8,h*1.1);c.lineTo(w*.8+Math.cos(Math.PI+a*.115)*w,h*1.1+Math.sin(Math.PI+a*.115)*w);c.stroke()}}
 else{for(var i=0;i<w;i+=14)for(var j=0;j<h;j+=14){if(Math.random()<.18){c.globalAlpha=Math.random()*.5;c.fillStyle=pal[2];c.fillRect(i,j,10,10)}}}
 c.globalAlpha=1;var sh=c.createLinearGradient(0,h*.3,0,h);sh.addColorStop(0,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.65)");c.fillStyle=sh;c.fillRect(0,0,w,h);
 var img=new Image();img.onload=function(){c.drawImage(img,w-92,10,80,80)};img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICON[id].replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" ').replace(/<rect width="100" height="100" fill="[^"]+"\/>/,""));
}

/* ---------- OVERLAYS ---------- */
function closeOverlay(){$("#overlay").innerHTML=""}
function openFolder(){
 $("#overlay").innerHTML='<div class="scrim" data-close="1"><div class="fold"><h4>Tycoon</h4><div class="box">'+["bastion","mafia","studio"].map(function(id){return '<button class="app" data-game="'+id+'"><span class="ic">'+ICON[id]+'</span><b>'+G[id].name+'</b></button>'}).join("")+'</div></div></div>';
}
function openApp(id){
 var a=APPS.filter(function(x){return x.id===id})[0];
 $("#overlay").innerHTML='<div class="scrim" data-close="1" style="align-items:flex-end;padding:0"></div><div class="sheet" role="dialog" aria-label="'+a.name+'"><div class="grab"></div><div class="sh-head"><span class="ic">'+ICON[a.id]+'</span><div><h5>'+a.name+'</h5><small>'+a.tag+'</small><br><a class="open" href="'+a.url+'" target="_blank" rel="noopener">Ouvrir</a></div></div><div class="facts"><div><em>Genre</em><strong>'+a.cat.split(" · ")[0]+'</strong></div><div><em>Créé par</em><strong>Seven</strong></div><div><em>Statut</em><strong>'+(a.live?"En ligne":"Aperçu")+'</strong></div></div><p>'+a.desc+'</p><div class="note">'+(a.live?"Astuce : dans Safari, Partager → Sur l'écran d'accueil pour l'avoir comme une vraie appli.":"Version aperçu, elle s'ouvre directement dans le navigateur.")+'</div></div>';
}

/* ---------- GAME ---------- */
var cur=null,S=null,tab="b",qty=1,tick=null,lastT=0,boostAt=0,boostShown=false,confirmPres=false;
function openGame(id,skipHash){
 closeOverlay();cur=id;S=load(id);tab="b";qty=1;confirmPres=false;
 var g=G[id],gm=$("#game");gm.className=g.cls;gm.hidden=false;document.body.style.overflow="hidden";
 // offline earnings
 var away=Math.min(8*3600,(Date.now()-S.last)/1000),inc=income(id,S,true);
 var off=S.life>0&&away>30?inc*away*.6:0;
 gm.innerHTML='<div class="wrap"><div class="g-top"><button class="g-back" data-back="1" aria-label="Retour au store"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><div class="g-title"><small>Lima Store · Tycoon</small><b>'+g.full+'</b></div></div>'
  +'<div class="g-hud"><div class="eyebrow" style="color:var(--g-mute)">'+g.cashLabel+'</div><div class="g-cash" id="gCash">0</div><div class="g-sub"><span><b id="gInc">0</b> '+g.unit+'/s</span><span>tap <b id="gTapV">0</b></span><span id="gPts"></span></div><div class="g-rank"><span>Rang : <b id="gRank"></b></span><span id="gNext" style="float:right"></span><div class="bar"><i id="gBar"></i></div></div></div>'
  +'<button class="tap" id="gTap"><span>'+g.tap+'</span><small id="gTapS"></small></button>'
  +'<div id="gBoost"></div>'
  +'<div class="tabs"><button data-tab="b">Bâtir</button><button data-tab="u">Améliorer</button><button data-tab="p">'+g.pres.pt+'</button><div class="mult" id="gMult"><button data-q="1">×1</button><button data-q="10">×10</button><button data-q="max">Max</button></div></div>'
  +'<div id="gBody"></div></div>';
 if(!S.life&&!S.cash){S.cash=0}
 if(off>0){S.cash+=off;S.life+=off;S.total+=off;
  var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="card"><small>Pendant ton absence ('+fmtTime(away)+')</small><b>+'+fmt(off)+' '+g.unit+'</b><div style="font-size:13.5px;color:var(--g-mute)">Tes affaires ont tourné sans toi.</div><button data-x="1">Récupérer</button></div>';gm.appendChild(m);}
 if(!skipHash)try{history.pushState({g:id},"","#"+id)}catch(e){location.hash=id}
 boostAt=Date.now()+rand(40,90)*1000;boostShown=false;
 renderBody();update(true);
 lastT=performance.now();clearInterval(tick);tick=setInterval(loop,100);
}
function rand(a,b){return a+Math.random()*(b-a)}
function closeGame(){
 if(!cur)return;save(cur,S);clearInterval(tick);cur=null;$("#game").hidden=true;$("#game").innerHTML="";document.body.style.overflow="";renderStore();
}
function loop(){
 var now=performance.now(),dt=Math.min(1,(now-lastT)/1000);lastT=now;
 var e=income(cur,S)*dt;S.cash+=e;S.life+=e;S.total+=e;
 if(!boostShown&&Date.now()>boostAt&&S.own[0]>0)showBoost();
 if(boostShown&&Date.now()>boostAt+20000){$("#gBoost").innerHTML="";boostShown=false;boostAt=Date.now()+rand(60,120)*1000}
 update();
 if(Math.random()<.02)save(cur,S);
}
function showBoost(){
 boostShown=true;var b=G[cur].boost;
 $("#gBoost").innerHTML='<button class="boost" id="gBoostBtn"><div><b>'+b.n+'</b><small>'+b.d+'</small></div><span class="go">Prendre</span></button>';
}
var lastRender=0;
function update(force){
 var g=G[cur],inc=income(cur,S);
 $("#gCash").textContent=fmt(S.cash)+" "+g.unit;
 $("#gInc").textContent=fmt(inc);
 $("#gTapV").textContent="+"+fmt(tapValue(cur,S));
 $("#gPts").innerHTML=S.pts?g.pres.pt+" <b>"+S.pts+"</b>":"";
 var r=rankOf(cur,S);$("#gRank").textContent=r.name;$("#gNext").textContent=r.next?"→ "+r.next:"Sommet atteint";$("#gBar").style.width=(r.p*100).toFixed(1)+"%";
 var bo=S.boostEnd-Date.now();$("#gTapS").textContent=bo>0?"×7 · "+Math.ceil(bo/1000)+" s":"";
 if(force||performance.now()-lastRender>250){lastRender=performance.now();refreshBody()}
}
function renderBody(){
 document.querySelectorAll("#game .tabs [data-tab]").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
 document.querySelectorAll("#gMult button").forEach(function(b){b.classList.toggle("on",String(qty)===b.dataset.q)});
 $("#gMult").style.visibility=tab==="b"?"visible":"hidden";
 var g=G[cur],h="";
 if(tab==="b"){
  h='<div class="b-list">'+g.b.map(function(b,i){return '<div class="b" id="bb'+i+'"><div class="gl"><svg viewBox="0 0 24 24"><path d="'+b[1]+'"/></svg><em id="bo'+i+'">0</em></div><div class="mid"><b>'+b[0]+'</b><small id="bi'+i+'"></small><div class="pr"><i id="bp'+i+'"></i></div></div><button class="buy" id="bt'+i+'" data-buy="'+i+'"></button></div>'}).join("")+'</div>';
 }else if(tab==="u"){h='<div class="b-list" id="uList"></div>'}
 else{h='<div class="pres" id="pBox"></div>'}
 $("#gBody").innerHTML=h;refreshBody(true);
}
var lastUKey="",lastPKey="";
function refreshBody(force){
 var g=G[cur];
 if(tab==="b"){
  var visibleUntil=0;for(var i=0;i<BASE_COST.length;i++){if(S.own[i]>0||i===0)visibleUntil=i+1}
  g.b.forEach(function(b,i){
   var row=$("#bb"+i);if(!row)return;
   var locked=i>visibleUntil;row.classList.toggle("lock",locked);
   var o=S.own[i],n=qty==="max"?Math.max(1,maxBuy(i,o,S.cash)):qty,c=costOf(i,o,n);
   var per=BASE_INC[i]*bMult(cur,S,i)*gMult(cur,S);
   $("#bo"+i).textContent=o;
   $("#bi"+i).textContent=locked?"Débloque le précédent d'abord":(o?fmt(per*o)+" "+g.unit+"/s · ":"")+"+"+fmt(per*n)+"/s";
   var nx=MILESTONES.filter(function(t){return t>o})[0]||o,pv=MILESTONES.filter(function(t){return t<=o}).pop()||0;
   $("#bp"+i).style.width=(nx===o?100:((o-pv)/(nx-pv)*100)).toFixed(0)+"%";
   var bt=$("#bt"+i);bt.disabled=locked||S.cash<c;bt.innerHTML=fmt(c)+" "+g.unit+"<small>×"+n+(nx!==o?" · ×2 à "+nx:"")+"</small>";
  });
 }else if(tab==="u"){
  var ups=upgradesFor(cur).filter(function(u){return !S.up[u.id]&&(!u.need||S.own[u.need[0]]>=u.need[1])}).slice(0,8);
  var key=ups.map(function(u){return u.id+(S.cash>=u.cost)}).join();
  if(key===lastUKey&&!force)return;lastUKey=key;
  $("#uList").innerHTML=ups.length?ups.map(function(u){return '<div class="b"><div class="mid"><b>'+u.n+'</b><div class="u-desc">'+u.d+'</div></div><button class="buy" data-up="'+u.id+'" '+(S.cash<u.cost?"disabled":"")+'>'+fmt(u.cost)+" "+g.unit+'</button></div>'}).join(""):'<div class="empty">Aucune amélioration pour l\'instant. Achète plus de bâtiments pour en débloquer.</div>';
 }else{
  var gain=presGain(S);var key2=gain+"|"+confirmPres+"|"+S.pts;if(key2===lastPKey&&!force)return;lastPKey=key2;
  var p=g.pres,inc=income(cur,S,true);
  $("#pBox").innerHTML='<h6>'+p.n+'</h6><p>'+p.d+'</p><div class="eyebrow" style="color:var(--g-mute)">Tu gagnerais</div><div class="big num">+'+gain+' '+p.pt.toLowerCase()+'</div>'
   +(confirmPres?'<p style="margin-top:10px;color:var(--g-fg)">Sûr ? Ton argent, tes bâtiments et tes améliorations repartent à zéro.</p><div class="confirm"><button data-pres="no">Annuler</button><button data-pres="yes" style="background:var(--g-acc);color:var(--g-on);border-color:var(--g-acc)">Confirmer</button></div>'
   :'<button class="cta" data-pres="ask" '+(gain<1?"disabled":"")+'>'+(gain<1?"Encore un peu d'argent à gagner":p.n)+'</button>')
   +'<div class="stats"><div><em>'+p.pt+' actuels</em><b>'+S.pts+' (+'+(S.pts*5)+' %)</b></div><div><em>Gagné au total</em><b>'+fmt(S.total)+'</b></div><div><em>Taps</em><b>'+S.taps.toLocaleString("fr-FR")+'</b></div><div><em>'+p.n+'s</em><b>'+S.resets+'</b></div></div>';
 }
}
function flyText(x,y,t){var f=document.createElement("div");f.className="fly";f.textContent=t;f.style.left=(x-20)+"px";f.style.top=(y-20)+"px";$("#game").appendChild(f);setTimeout(function(){f.remove()},800)}
function toast(t){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.textContent=t;$("#game").appendChild(d);setTimeout(function(){d.remove()},2200)}

/* ---------- EVENTS ---------- */
document.addEventListener("click",function(e){
 var t=e.target.closest("button,[data-close]");if(!t)return;
 if(t.dataset.close&&e.target===t){closeOverlay();return}
 if(t.dataset.folder){openFolder();return}
 if(t.dataset.app){openApp(t.dataset.app);return}
 if(t.dataset.game){openGame(t.dataset.game);return}
 if(t.dataset.back){if(location.hash){history.back()}else closeGame();return}
 if(!cur)return;
 if(t.id==="gTap"){var v=tapValue(cur,S);S.cash+=v;S.life+=v;S.total+=v;S.taps++;flyText(e.clientX||innerWidth/2,e.clientY||300,"+"+fmt(v));update();return}
 if(t.id==="gBoostBtn"){S.boostEnd=Date.now()+30000;$("#gBoost").innerHTML="";boostShown=false;boostAt=Date.now()+rand(70,140)*1000;toast(G[cur].boost.n+" : revenus ×7 pendant 30 s");update(true);return}
 if(t.dataset.tab){tab=t.dataset.tab;confirmPres=false;lastUKey=lastPKey="";renderBody();return}
 if(t.dataset.q){qty=t.dataset.q==="max"?"max":+t.dataset.q;renderBody();return}
 if(t.dataset.buy!==undefined){var i=+t.dataset.buy,o=S.own[i],n=qty==="max"?maxBuy(i,o,S.cash):qty;if(n<1)return;var c=costOf(i,o,n);if(S.cash>=c){S.cash-=c;S.own[i]+=n;var before=MILESTONES.filter(function(m){return m<=o}).length,after=MILESTONES.filter(function(m){return m<=S.own[i]}).length;if(after>before)toast(G[cur].b[i][0]+" : revenus ×2 !");if(o===0&&G[cur].b[i+1])toast("Débloqué : "+G[cur].b[i+1][0]);save(cur,S);update(true)}return}
 if(t.dataset.up){var u=upgradesFor(cur).filter(function(x){return x.id===t.dataset.up})[0];if(u&&S.cash>=u.cost){S.cash-=u.cost;S.up[u.id]=1;toast(u.n+" : "+u.d);lastUKey="";save(cur,S);update(true)}return}
 if(t.dataset.pres==="ask"){confirmPres=true;refreshBody(true);return}
 if(t.dataset.pres==="no"){confirmPres=false;refreshBody(true);return}
 if(t.dataset.pres==="yes"){var gn=presGain(S),pts=S.pts+gn,r=S.resets+1,tot=S.total,tp=S.taps,st=S.started;S=fresh();S.pts=pts;S.resets=r;S.total=tot;S.taps=tp;S.started=st;S.cash=50;confirmPres=false;save(cur,S);toast("+"+gn+" "+G[cur].pres.pt.toLowerCase()+". Revenus +"+(pts*5)+" % pour toujours.");tab="b";renderBody();update(true);return}
 if(t.dataset.x){t.closest(".modal").remove();save(cur,S);return}
});
window.addEventListener("popstate",function(){var h=location.hash.slice(1);if(G[h]&&!cur)openGame(h,true);else if(!G[h]&&cur)closeGame()});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(G[h]&&cur!==h){if(cur)closeGame();openGame(h,true)}else if(!G[h]&&cur)closeGame()});
document.addEventListener("visibilitychange",function(){if(document.hidden&&cur)save(cur,S)});
window.addEventListener("pagehide",function(){if(cur)save(cur,S)});
window.addEventListener("resize",function(){if(!cur)drawFeat((function(){var b=$(".feat");return b?b.dataset.game:"bastion"})())});

renderStore();
var h0=location.hash.slice(1);if(G[h0])openGame(h0,true);
})();
</script>
